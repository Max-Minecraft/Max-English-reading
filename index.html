<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max 的 FCE 精读书架</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1f2d3d; --sub:#6b7a90;
  --brand:#4f7cff; --brand2:#7c5cff; --ok:#22b573; --warn:#f5a623; --line:#e6ebf3;
  --peo:#4f7cff; --sci:#22b573; --his:#f5a623; --nat:#12b5c9; --bus:#b0792a; --cul:#c05299; --oth:#8b93a7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
/* 顶栏 */
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
header.top h1{font-size:22px;background:linear-gradient(90deg,var(--brand),var(--brand2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tip{background:#fff7e6;border:1px solid #ffe1a8;color:#8a6d1a;
  border-radius:12px;padding:10px 14px;font-size:13px;margin:12px 0 18px}
.tip b{color:#b26b00}
/* 搜索 + 筛选 */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
#search{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:15px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.stat{font-size:13px;color:var(--sub);margin-left:auto}
/* 书架卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(79,124,255,.15)}
.card .day{font-size:12px;color:var(--sub);font-weight:600}
.card h3{font-size:16px;margin:6px 0 4px;line-height:1.4}
.card .zh{font-size:12px;color:var(--sub);margin-bottom:10px}
.card .foot{display:flex;align-items:center;gap:8px;font-size:12px}
.cat{padding:2px 8px;border-radius:6px;color:#fff;font-size:11px}
.stbadge{margin-left:auto;font-size:12px}
.bar{position:absolute;left:0;top:0;bottom:0;width:5px}
/* 阅读器 */
#reader{display:none}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;
  font-size:14px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.rtitle{font-size:20px;margin:4px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:6px}
.meta span{background:#eef2fb;padding:3px 9px;border-radius:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{background:#eef2fb;color:var(--brand);padding:3px 10px;border-radius:20px;font-size:12px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.sec h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:5px;height:18px;background:var(--brand);border-radius:3px}
.introbox{background:#f0f5ff;border-left:4px solid var(--brand);padding:12px 14px;
  border-radius:8px;font-size:14px;color:#33507a}
/* 分段精读 */
.pg{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.pg:last-child{border:none;margin:0;padding:0}
.en{font-size:15px;line-height:1.9}
.zh-toggle{color:var(--brand);font-size:13px;cursor:pointer;user-select:none;margin:6px 0;display:inline-block}
.zh{display:none;color:#3a4a63;background:#f6f8fc;border-radius:8px;padding:8px 12px;font-size:14px;margin-top:4px}
.zh.show{display:block}
.pnote{font-size:13px;color:var(--warn);margin-top:6px}
.pnote::before{content:"💡 ";}
/* 生词表 */
table.v{width:100%;border-collapse:collapse;font-size:14px}
table.v th,table.v td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.v th{color:var(--sub);font-size:12px;font-weight:600}
.w{font-weight:700;color:var(--ink)}
.phon{color:var(--sub);font-size:12px}
.spk{cursor:pointer;border:none;background:none;font-size:14px}
.pos{color:var(--brand2);font-size:12px}
/* 长难句 */
.hs{background:#f6f8fc;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.hs .en{font-size:14px;font-weight:600}
.hs .st{font-size:13px;color:#5a4b8a;margin:6px 0}
.hs .zh2{font-size:13px;color:#3a4a63}
/* 题目 */
.qa{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qn{background:var(--brand);color:#fff;width:24px;height:24px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.qtech{background:#fff0f6;color:#c2338a;padding:2px 9px;border-radius:20px;font-size:12px}
.qtext{font-weight:600;font-size:14px;margin-bottom:8px}
.opt{padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0;font-size:14px;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:#eef3ff;font-weight:600}
.opt.right{background:#e8f9ef;border-color:var(--ok);color:#137a44;font-weight:600}
.opt.wrong{background:#fdeaea;border-color:#e5534b;color:#b3342c;font-weight:600}
.qa[data-done="1"] .opt{cursor:default}
.qa[data-done="1"] .opt:hover{border-color:var(--line)}
.qa[data-done="1"] .opt.right:hover{border-color:var(--ok)}
.qa[data-done="1"] .opt.wrong:hover{border-color:#e5534b}
.qact{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.cfm:disabled{opacity:.45;cursor:not-allowed}
.qres{font-size:13px;font-weight:600}
.qres.ok{color:var(--ok)}
.qres.no{color:#d63031}
.reveal{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.reveal.show{display:block}
.reveal .lab{font-size:12px;color:var(--sub);font-weight:600;margin-top:8px}
.reveal p{font-size:13px;color:#3a4a63;margin-top:2px}
.tipbox{background:#fff7e6;border-radius:8px;padding:8px 12px;font-size:13px;color:#8a6d1a;margin-bottom:8px}
.footnav{display:flex;justify-content:space-between;margin-top:20px}
.empty{text-align:center;color:var(--sub);padding:40px}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<!-- 书架首页 -->
<div id="shelf">
  <header class="top"><h1>📚 Max 的 FCE 精读书架</h1></header>
  <div class="tip">📖 <b>先在纸质书上读文章、做完 6 道题</b>，再打开这里对答案 + 精讲。这里是「课后精讲」，不是电子课本哦。</div>
  <div class="tools">
    <input id="search" placeholder="🔍 搜标题 / 主题 / 关键词，如 Adele、Grammy、Day 1">

  </div>
  <div class="chips" id="catChips"></div>
  <div class="chips" id="stChips" style="margin:10px 0 16px"></div>
  <div class="grid" id="grid"></div>

</div>
<!-- 阅读器 -->
<div id="reader"></div>
</div>
<script>
const ARTICLES = [{"id": "day001", "day": 1, "title": "The Voice That Rules the Music World", "titleZh": "统治乐坛的天籁之声", "category": "People", "categoryZh": "人物", "textForm": "Biography / 人物传记类说明文", "wordCount": 300, "level": "B1-B2", "techniques": ["Main Idea", "Subject Matter", "Supporting Details", "Inference", "Words in Context", "Clarifying Devices"], "intro": "本篇是《超强英语阅读训练 2》Day 1，讲英国歌手 Adele（阿黛尔）。属于人物传记类说明文：按时间顺序讲一个人的成长与成就。读这类文章，抓住「时间线 + 转折点 + 作者态度」就抓住了全文。", "passages": [{"en": "Adele Adkins was born in North London, England, in 1988. Her mother, Penny Adkins, was 18 years old at the time of her birth. There were some hard times for both of them during the early years. Adele's father left when Adele was just four years old. He would keep in contact with her over the years, but it was often a troubled relationship. Adele eventually broke all contact with him when she was a teenager.", "zh": "阿黛尔·阿德金斯 1988 年出生于英国北伦敦。她出生时，母亲 Penny Adkins 只有 18 岁。母女俩早年过了一段艰难的日子。阿黛尔 4 岁时父亲就离开了。多年来父亲一直和她保持联系，但这段关系常常并不融洽。阿黛尔十几岁时，最终和父亲断绝了一切来往。", "note": "开头交代出身：年轻的单亲妈妈 + 缺席的父亲，为后文「艰难童年」埋线。"}, {"en": "School was a problem for Adele early on. She often felt bored and uninspired in class. Fortunately, things turned around when she was accepted into the BRIT School for Performing Arts & Technology. This was the same school that Amy Winehouse attended. The school allowed Adele to develop her love of music and skills in playing multiple instruments, including the flute, saxophone, and guitar.", "zh": "阿黛尔早年在学校也不顺。她上课常常觉得无聊、提不起劲。幸运的是，当她被 BRIT 表演艺术与技术学校录取后，情况有了转机。这所学校正是艾米·怀恩豪斯就读过的学校。学校让阿黛尔得以发展她对音乐的热爱，并学会演奏多种乐器，包括长笛、萨克斯和吉他。", "note": "第一个转折点：Fortunately + turned around 是明显的信号词。这里是全文由「低谷」转向「上升」的关键。"}, {"en": "Adele's big break came when she was still at the BRIT School. She posted a short demo album on her MySpace page. Some studio executives listened to it, and then decided to sign her to a contract.", "zh": "阿黛尔的重大机遇出现在她还在 BRIT 学校读书时。她在自己的 MySpace 页面上发布了一张简短的试听专辑。一些唱片公司高管听后，决定与她签约。", "note": "big break（重大机遇）是人物传记的高频词，指命运转折的那一刻。"}, {"en": "Adele's rise to fame since then has been incredible. She has recorded three albums: 19, 21, and 25. All of them are named after her age at the time of production. These albums contain memorable songs like Rolling in the Deep and Someone Like You. They have sold over 40 million copies worldwide. Adele has also received countless awards. She swept the top categories of the Grammy Awards in 2012 and 2017 — a first in Grammy history.", "zh": "自那以后，阿黛尔的成名之路势不可挡。她录制了三张专辑：《19》《21》《25》，全部以制作时她的年龄命名。这些专辑收录了《Rolling in the Deep》《Someone Like You》等脍炙人口的歌曲，全球销量超过 4000 万张。阿黛尔还赢得了无数奖项。她在 2012 年和 2017 年横扫格莱美各大奖项——这在格莱美历史上尚属首次。", "note": "用「专辑数量、销量、获奖」等具体数字做 Supporting Details（支持性细节），证明她有多成功。"}, {"en": "Perhaps more important than Adele's commercial success is the way she did it. Adele is unlike other pop stars, who tend to be managed and controlled by their labels. She is driven, independent, and immensely talented. She also feels comfortable in her own skin. Some have even described her as a \"force of nature.\" It's hard to imagine a better female role model for her millions of fans worldwide.", "zh": "或许比商业成功更重要的，是她成功的方式。阿黛尔不像其他流行歌手那样往往被唱片公司安排和掌控。她有干劲、独立，而且才华横溢，还非常自在做自己。有人甚至把她形容为「一股自然的力量」。很难想象，对全球数百万粉丝来说，还有比她更好的女性榜样。", "note": "结尾是作者亮明观点的地方：作者态度明显是「赞赏」。Perhaps more important... 把话题从「成功」拔高到「怎样成功」，这就是全文的中心思想。"}], "vocab": [{"word": "troubled", "phon": "/ˈtrʌbld/", "pos": "adj.", "def": "having a lot of problems", "zh": "麻烦不断的；不融洽的", "sentence": "...but it was often a troubled relationship."}, {"word": "uninspired", "phon": "/ˌʌnɪnˈspaɪəd/", "pos": "adj.", "def": "not excited or interested", "zh": "提不起劲的；无精打采的", "sentence": "She often felt bored and uninspired in class."}, {"word": "turn around", "phon": "/tɜːn əˈraʊnd/", "pos": "phrase", "def": "to change from bad to good", "zh": "（局面）好转、扭转", "sentence": "...things turned around when she was accepted into the BRIT School."}, {"word": "big break", "phon": "/bɪɡ breɪk/", "pos": "phrase", "def": "a chance that leads to success", "zh": "重大机遇、成名契机", "sentence": "Adele's big break came when she was still at the BRIT School."}, {"word": "demo", "phon": "/ˈdeməʊ/", "pos": "n.", "def": "a sample recording to show one's talent", "zh": "（歌曲的）试听样带", "sentence": "She posted a short demo album on her MySpace page."}, {"word": "executive", "phon": "/ɪɡˈzekjətɪv/", "pos": "n.", "def": "an important manager in a company", "zh": "（公司）高管、主管", "sentence": "Some studio executives listened to it..."}, {"word": "sign sb to a contract", "phon": "/saɪn ... ˈkɒntrækt/", "pos": "phrase", "def": "to make a formal agreement to work with someone", "zh": "与某人签约", "sentence": "...decided to sign her to a contract."}, {"word": "rise to fame", "phon": "/raɪz tə feɪm/", "pos": "phrase", "def": "the process of becoming famous", "zh": "成名之路", "sentence": "Adele's rise to fame since then has been incredible."}, {"word": "sweep", "phon": "/swiːp/", "pos": "v.", "def": "to win all or most of the prizes", "zh": "横扫、包揽（奖项）", "sentence": "She swept the top categories of the Grammy Awards..."}, {"word": "commercial", "phon": "/kəˈmɜːʃl/", "pos": "adj.", "def": "connected with making money", "zh": "商业的；商业上的", "sentence": "Perhaps more important than Adele's commercial success..."}, {"word": "driven", "phon": "/ˈdrɪvn/", "pos": "adj.", "def": "very determined to succeed", "zh": "有干劲的、上进的", "sentence": "She is driven, independent, and immensely talented."}, {"word": "immensely", "phon": "/ɪˈmensli/", "pos": "adv.", "def": "extremely; very much", "zh": "极其、非常", "sentence": "She is driven, independent, and immensely talented."}, {"word": "comfortable in one's own skin", "phon": "/ˈkʌmftəbl ... skɪn/", "pos": "phrase", "def": "happy with who you are", "zh": "自在做自己、接纳自己", "sentence": "She also feels comfortable in her own skin."}, {"word": "force of nature", "phon": "/fɔːs əv ˈneɪtʃə/", "pos": "phrase", "def": "a person with a very strong, powerful personality", "zh": "一股自然之力（形容人个性强大、势不可挡）", "sentence": "Some have even described her as a \"force of nature.\""}, {"word": "role model", "phon": "/rəʊl ˈmɒdl/", "pos": "n.", "def": "someone people admire and try to copy", "zh": "榜样、楷模", "sentence": "It's hard to imagine a better female role model..."}], "hardSentences": [{"en": "He would keep in contact with her over the years, but it was often a troubled relationship.", "structure": "would 在这里不是「将要」，而是表示「过去反复发生的动作」（过去常常……）。keep in contact with sb = 与某人保持联系。", "zh": "多年来他一直（时不时）和她保持联系，但这段关系常常并不融洽。"}, {"en": "Fortunately, things turned around when she was accepted into the BRIT School for Performing Arts & Technology.", "structure": "主句 things turned around（局面好转）+ when 引导时间状语从句。was accepted into 被动语态，「被……录取」。Fortunately 是作者态度信号词。", "zh": "幸运的是，当她被 BRIT 表演艺术与技术学校录取后，局面有了转机。"}, {"en": "Perhaps more important than Adele's commercial success is the way she did it.", "structure": "这是一个倒装句，正常语序是 The way she did it is perhaps more important than Adele's commercial success. 把表语 more important... 提到句首，起强调作用。the way (that) she did it = 她做成这件事的方式。", "zh": "或许，比起商业上的成功，她「怎样成功」这件事更重要。"}], "questions": [{"n": 1, "technique": "Main Idea", "techniqueZh": "中心思想", "q": "Which sentence is closest to the main point?", "options": ["Adele broke records at the Grammy Awards.", "Adele is a special kind of talent.", "Adele attended the BRIT School for Performing Arts & Technology.", "Adele recorded three albums."], "answer": 1, "skillTip": "中心思想题问「作者最想说什么」。别被具体事实（获奖、上学、专辑）迷惑——那些都是细节。要找那句能「盖住全文」的话。", "explain": "全文既讲她的成就，更强调她「独特、独立、才华横溢」的特质，b「阿黛尔是一种特别的天才」最能概括全文。", "why": "a、c、d 都只是文中的某一个细节，范围太小，盖不住全文，属于「以偏概全」的干扰项。"}, {"n": 2, "technique": "Subject Matter", "techniqueZh": "主题", "q": "What does this passage describe?", "options": ["An album.", "A song.", "A musician.", "A voice."], "answer": 2, "skillTip": "主题题问「这篇文章在写什么」。读完前几行就能判断——通常是文章反复出现的那个「主角」。", "explain": "全文自始至终都在写 Adele 这个人（一位音乐人），所以选 c。", "why": "album、song、voice 都只是围绕这位音乐人展开的细节，不是文章整体的主题。"}, {"n": 3, "technique": "Supporting Details", "techniqueZh": "支持性细节", "q": "Which of the following statements about Adele is NOT true?", "options": ["She didn't like school as a child.", "She recorded the song Someone Like You.", "She was born in Scotland.", "She has won several Grammy Awards."], "answer": 2, "skillTip": "细节题（尤其带 NOT）要「回原文逐条核对」，不能凭印象。找到与原文冲突的那一项。", "explain": "原文第一句说她出生在 North London, England（英格兰北伦敦），不是 Scotland（苏格兰），所以 c 是错误陈述，符合题目问的 NOT true。", "why": "a 对应 School was a problem；b 对应 Someone Like You；d 对应 swept the Grammy Awards——这三项原文都能找到依据，都是真的。"}, {"n": 4, "technique": "Inference", "techniqueZh": "推理", "q": "What can we infer about Adele's childhood from the passage?", "options": ["Adele's mom had some struggles with money.", "Adele didn't like to sing when she was young.", "Adele didn't have many friends in her neighborhood.", "Adele was very religious."], "answer": 0, "skillTip": "推理题不能直接抄原文，要「据文推断」：找到原文线索 + 合理推测。答案一定要有原文根据，不能凭空想。", "explain": "原文说妈妈生她时才 18 岁，且早年「有一段艰难的日子（hard times）」，由此可合理推断家里经济上有困难，选 a。", "why": "b、c、d 文中都没有任何线索支持，属于「无中生有」的推断。"}, {"n": 5, "technique": "Words in Context", "techniqueZh": "语境词义", "q": "What does force of nature mean in the final paragraph?", "options": ["Someone who was born rich.", "Someone with a strong personality.", "Someone who doesn't like the countryside.", "Someone who likes being outdoors."], "answer": 1, "skillTip": "语境词义题：别背词典义，要「看这个词周围的话」。上文说她 driven, independent（有干劲、独立），下文夸她是榜样。", "explain": "结合上下文，force of nature 是夸她个性强大、充满力量，选 b「个性强大的人」。", "why": "a、c、d 都是从字面 nature（自然）去硬猜，脱离了上下文，是典型的「望文生义」干扰项。"}, {"n": 6, "technique": "Clarifying Devices", "techniqueZh": "阐释手法", "q": "What does the author do in the final paragraph to capture the reader's attention?", "options": ["Shares a personal experience.", "Presents interesting statistics.", "Makes a strong argument.", "Describes several steps."], "answer": 2, "skillTip": "阐释手法题问「作者用什么方法」。要看最后一段是在「摆数据、讲故事、讲步骤，还是在表明立场、下结论」。", "explain": "最后一段作者亮明观点：她成功的「方式」更重要、她是最好的榜样——这是在提出一个有力的论断，选 c。", "why": "数据（statistics）出现在上一段而非最后一段；作者没有讲个人经历，也没有列步骤，故 a、b、d 都不对。"}]}, {"id": "day002", "day": 2, "title": "History of Wall Street", "titleZh": "华尔街的历史", "category": "Business", "categoryZh": "商业", "textForm": "Expository / 历史类说明文", "wordCount": 300, "level": "B1-B2", "techniques": ["Main Idea", "Subject Matter", "Supporting Details", "Inference", "Words in Context", "Clarifying Devices"], "intro": "本篇是《超强英语阅读训练 2》Day 2，讲华尔街的历史。属于历史类说明文：按时间顺序讲一个地方/机构的变迁。读这类文章，抓住「时间线 + 关键年份 + 今昔对比」，就抓住了全文骨架。", "passages": [{"en": "What is now New York City was once a Dutch colony. After the Dutch bought the land from the Native Americans in the area, they built a wall to protect themselves from attacks. The wall lasted for about 50 years in the mid-1600s, but the name it gave to the street that ran along it has lived for centuries.", "zh": "如今的纽约市，曾经是荷兰人的殖民地。荷兰人从当地美洲原住民手中买下这片土地后，建了一堵墙来保护自己免受袭击。这堵墙在 17 世纪中期大约存在了 50 年，但它给旁边那条街留下的名字，却流传了好几个世纪。", "note": "开篇点题：华尔街的名字来自一堵「墙（wall）」。注意 mid-1600s 和 for centuries 这组时间跨度——从 17 世纪讲到今天，历史感就是全文线索。"}, {"en": "Wall Street became a center of commerce early in New York's history. Though it was only a handful of blocks long, it connected the East River with other major streets, which made it a convenient place to set up warehouses for imported goods and facilities for exports.", "zh": "华尔街在纽约历史的早期就成为了商业中心。尽管它只有短短几个街区长，却连接着东河和其他主要街道，这使它成为设立进口商品仓库和出口设施的好地方。", "note": "a handful of = 少量（呼应第 5 题）。Though（尽管）引导让步：街区虽少，位置却极好——地理优势带来商业繁荣。"}, {"en": "The idea of buying and selling bonds, contracts, and other investments in businesses wasn't new. The first stock exchange was set up in Belgium in 1531, followed by exchanges in Amsterdam and Paris. In New York, wealthy merchants along Wall Street traded stocks by word of mouth. They would meet under a buttonwood tree at the end of the street. In 1792, they got tired of this informal state of affairs. That year, a group of men formally established what they called The Stock Exchange Office, a formal, regulated entity to buy and sell stocks through.", "zh": "买卖债券、合同和其他商业投资，并不是什么新鲜事。世界上第一家证券交易所 1531 年就在比利时成立了，随后阿姆斯特丹和巴黎也出现了交易所。在纽约，华尔街上的富商们靠口头约定交易股票，他们常常聚在街尾的一棵梧桐树下。到了 1792 年，他们厌倦了这种不正式的状态。那一年，一群人正式成立了他们称之为「股票交易办公室」（The Stock Exchange Office）的机构——一个正式的、受监管的、用来买卖股票的实体。", "note": "记住两个年份：1531（世界第一家交易所，在比利时）和 1792（纽约正式成立交易机构）。by word of mouth（口头约定）与 formally established（正式成立）形成对比——从「树下聊天」走向「正规机构」。"}, {"en": "The stock exchange in New York wasn't an instant success. On the contrary, in 1817, some members were upset with the poor performance of their exchange and went to observe the bustling, thriving exchange in Philadelphia. They came back with new ideas and made the first of many changes. In 1863, the organization was given its current name, the New York Stock Exchange (NYSE).", "zh": "纽约的证券交易所并非一举成功。恰恰相反，1817 年，一些成员对本交易所糟糕的表现感到不满，跑去观摩费城那个繁忙兴旺的交易所。他们带着新点子回来，做出了许多改革中的第一批。1863 年，这个机构得到了它现在的名字——纽约证券交易所（NYSE）。", "note": "On the contrary（恰恰相反）是关键信号词（呼应第 6 题）：先说「不成功」，再引出转折后的改进。1863 年正式定名 NYSE，记住这个时间点。"}, {"en": "The NYSE has weathered the storms, from bubbles, panics, and depression to acts of terrorism. So far, it continues to dominate American finance. In 1800, only about 20 companies were traded publicly. Today, a billion shares change hands every day. Prices rise and fall, but the bell that opens the NYSE every morning just keeps ringing.", "zh": "纽交所经受住了一场场风暴——从泡沫、恐慌、大萧条，到恐怖主义袭击。到目前为止，它依然主导着美国金融业。1800 年，公开上市交易的公司只有 20 家左右；而今天，每天有 10 亿股股票易手。价格有涨有跌，但每天清晨为纽交所开市敲响的那口钟，一直在响。", "note": "weathered the storms 是比喻：把危机比作风暴。今昔数字对比（20 家 vs 每天 10 亿股）说明它历久弥强。结尾 keeps ringing 用「钟一直响」暗示纽交所生生不息（呼应第 4 题推理）。"}], "vocab": [{"word": "colony", "phon": "/ˈkɒləni/", "pos": "n.", "def": "a land controlled by a faraway country", "zh": "殖民地", "sentence": "What is now New York City was once a Dutch colony."}, {"word": "protect...from...", "phon": "/prəˈtekt ... frɒm/", "pos": "phrase", "def": "to keep someone or something safe from harm", "zh": "保护……免受……", "sentence": "...they built a wall to protect themselves from attacks."}, {"word": "commerce", "phon": "/ˈkɒmɜːs/", "pos": "n.", "def": "the activity of buying and selling; trade", "zh": "商业；贸易", "sentence": "Wall Street became a center of commerce early in New York's history."}, {"word": "a handful of", "phon": "/ə ˈhændfʊl əv/", "pos": "phrase", "def": "a small number of", "zh": "少量的、几个", "sentence": "Though it was only a handful of blocks long..."}, {"word": "block", "phon": "/blɒk/", "pos": "n.", "def": "the distance along a street between two crossings", "zh": "街区；街段", "sentence": "...it was only a handful of blocks long."}, {"word": "warehouse", "phon": "/ˈweəhaʊs/", "pos": "n.", "def": "a large building for storing goods", "zh": "仓库", "sentence": "...a convenient place to set up warehouses for imported goods..."}, {"word": "bond", "phon": "/bɒnd/", "pos": "n.", "def": "an official paper promising to pay back borrowed money with interest", "zh": "债券", "sentence": "The idea of buying and selling bonds, contracts, and other investments..."}, {"word": "investment", "phon": "/ɪnˈvestmənt/", "pos": "n.", "def": "money put into something to make a profit", "zh": "投资；投资项目", "sentence": "...and other investments in businesses wasn't new."}, {"word": "stock exchange", "phon": "/stɒk ɪksˈtʃeɪndʒ/", "pos": "n.", "def": "a place where stocks and shares are bought and sold", "zh": "证券交易所", "sentence": "The first stock exchange was set up in Belgium in 1531."}, {"word": "merchant", "phon": "/ˈmɜːtʃənt/", "pos": "n.", "def": "a person who buys and sells goods", "zh": "商人", "sentence": "...wealthy merchants along Wall Street traded stocks by word of mouth."}, {"word": "by word of mouth", "phon": "/baɪ wɜːd əv maʊθ/", "pos": "phrase", "def": "by speaking, not in writing", "zh": "口头地、口口相传地", "sentence": "...traded stocks by word of mouth."}, {"word": "establish", "phon": "/ɪˈstæblɪʃ/", "pos": "v.", "def": "to set up; to create formally", "zh": "建立、成立", "sentence": "...a group of men formally established what they called The Stock Exchange Office."}, {"word": "regulated", "phon": "/ˈreɡjuleɪtɪd/", "pos": "adj.", "def": "controlled by official rules", "zh": "受监管的、有规章的", "sentence": "...a formal, regulated entity to buy and sell stocks through."}, {"word": "entity", "phon": "/ˈentəti/", "pos": "n.", "def": "a thing that exists as a single, complete unit", "zh": "实体、机构", "sentence": "...a formal, regulated entity to buy and sell stocks through."}, {"word": "on the contrary", "phon": "/ɒn ðə ˈkɒntrəri/", "pos": "phrase", "def": "used to show the opposite is true", "zh": "恰恰相反、正相反", "sentence": "On the contrary, in 1817, some members were upset..."}, {"word": "bustling", "phon": "/ˈbʌslɪŋ/", "pos": "adj.", "def": "full of busy activity", "zh": "繁忙热闹的", "sentence": "...the bustling, thriving exchange in Philadelphia."}, {"word": "weather the storm", "phon": "/ˈweðə ðə stɔːm/", "pos": "phrase", "def": "to survive a difficult period", "zh": "经受住风暴；渡过难关", "sentence": "The NYSE has weathered the storms, from bubbles, panics, and depression to acts of terrorism."}, {"word": "dominate", "phon": "/ˈdɒmɪneɪt/", "pos": "v.", "def": "to be the most powerful or important", "zh": "主导、支配", "sentence": "So far, it continues to dominate American finance."}, {"word": "change hands", "phon": "/tʃeɪndʒ hændz/", "pos": "phrase", "def": "to pass from one owner to another", "zh": "易手、转手", "sentence": "Today, a billion shares change hands every day."}], "hardSentences": [{"en": "Though it was only a handful of blocks long, it connected the East River with other major streets, which made it a convenient place to set up warehouses for imported goods and facilities for exports.", "structure": "Though 引导让步状语从句（尽管……）；主句 it connected...；which 引导非限制性定语从句，指代前面整件事（位置好），补充说明带来的结果。connect A with B = 把 A 和 B 连接起来。", "zh": "尽管它只有短短几个街区长，却连接着东河和其他主要街道，这使它成为设立进口商品仓库和出口设施的好地方。"}, {"en": "That year, a group of men formally established what they called The Stock Exchange Office, a formal, regulated entity to buy and sell stocks through.", "structure": "what they called The Stock Exchange Office 是 what 引导的宾语从句（他们称之为……的东西）；逗号后面 a formal, regulated entity... 是同位语，进一步解释这个机构是什么；to buy and sell stocks through 是不定式短语作后置定语，through 的宾语就是 entity。", "zh": "那一年，一群人正式成立了他们称之为「股票交易办公室」的机构——一个正式的、受监管的、用来买卖股票的实体。"}, {"en": "Prices rise and fall, but the bell that opens the NYSE every morning just keeps ringing.", "structure": "but 连接两个并列分句，构成对比（价格起落 vs 钟声不停）。that opens the NYSE every morning 是定语从句，修饰 the bell。keep doing sth = 一直做某事。just 在这里起强调作用。", "zh": "价格有涨有跌，但每天清晨为纽交所开市敲响的那口钟，一直在响。"}], "questions": [{"n": 1, "technique": "Main Idea", "techniqueZh": "中心思想", "q": "What is the main topic of the article?", "options": ["How to succeed on Wall Street.", "A history of stock exchanges.", "The NYSE today.", "How Wall Street rose."], "answer": 3, "skillTip": "中心思想题要「盖住全文」。拿到选项先问自己：它能概括文章的每一部分吗？文章从 17 世纪的墙一直讲到今天的纽交所，整条时间线都在讲华尔街怎样一步步兴起。", "explain": "全文按时间顺序讲华尔街从荷兰人的一堵墙 → 商贸中心 → 树下口头交易 → 正式成立交易所 → 至今主导美国金融，正是「华尔街如何兴起」的过程，选 d。", "why": "a「如何在华尔街成功」文章根本没讲；c「今天的纽交所」只占结尾一小段，盖不住全文；b「证券交易所的历史」范围太大——文章只讲华尔街这一处，不是泛泛讲全世界的交易所。"}, {"n": 2, "technique": "Subject Matter", "techniqueZh": "主题", "q": "What does the passage mainly deal with?", "options": ["A country.", "A road.", "A financial institution.", "An era."], "answer": 2, "skillTip": "主题题问「这篇文章在写哪一类对象」。别被字面骗到：华尔街虽然是一条街的名字，但文章反复出现的主角是以它为核心的交易所——一个金融机构。", "explain": "文章讲的是华尔街/纽交所这个金融机构几百年来的变迁，选 c「一个金融机构」。", "why": "b「一条路」是典型字面陷阱——华尔街确实是一条街，但文章不是介绍这条路本身；a「一个国家」和 d「一个时代」范围都对不上。"}, {"n": 3, "technique": "Supporting Details", "techniqueZh": "支持性细节", "q": "Which of the following statements is NOT true?", "options": ["The NYSE was not the name of America's first stock exchange.", "Early traders met under a tree to exchange stocks.", "The NYSE was the world's first stock exchange.", "Wall Street was named after a wall."], "answer": 2, "skillTip": "带 NOT 的细节题要「回原文逐条核对」，找与原文冲突的那一项，不能凭印象。", "explain": "原文明确说世界上第一家证券交易所 1531 年设在比利时，纽约这家不是世界第一。所以 c「纽交所是世界第一家证券交易所」是假的，正好符合题目问的 NOT true。", "why": "a 对应原文：1792 年成立时叫 The Stock Exchange Office，1863 年才改名 NYSE；b 对应 under a buttonwood tree；d 对应第一段荷兰人建的墙——这三项原文都有依据，都是真的。"}, {"n": 4, "technique": "Inference", "techniqueZh": "推理", "q": "What can we infer about the NYSE from the article?", "options": ["It was the first of its kind in the world.", "It's a very durable institution.", "It has shrunk in power over the years.", "It is owned and run by the Dutch."], "answer": 1, "skillTip": "推理题 = 原文线索 + 合理推断。正确答案一定要有原文依据，但又不是原文直说的句子。", "explain": "原文说纽交所 weathered the storms（挺过泡沫、恐慌、萧条、恐袭），至今 dominate 美国金融，开市的钟 keeps ringing——从这些线索可以推出：它是一个「非常持久、有生命力」的机构，选 b。", "why": "a「世界第一家」与原文（比利时 1531）直接矛盾；c「权力逐年缩小」与 dominate（主导）正好相反；d「由荷兰人拥有经营」毫无依据——荷兰人只是几百年前建了那堵墙。"}, {"n": 5, "technique": "Words in Context", "techniqueZh": "语境词义", "q": "The second paragraph mentions a handful of something. What does the word handful mean?", "options": ["A small number.", "A large number.", "Something that can be manipulated by hand.", "Something that can be hidden."], "answer": 0, "skillTip": "语境词义题别背词典义，要看这个词周围的话。句首的 Though（尽管）是关键：「尽管只有___个街区，却是商业中心」——让步关系要求空格填「少」。", "explain": "a handful of 字面是「一把」，在文中表示「少量、几个」：尽管华尔街只有短短几个街区长，却成了商业中心，选 a。", "why": "b「大量」与 Though 引导的让步矛盾（如果很多就不用「尽管」了）；c、d 都是抓住 hand（手）望文生义编出来的干扰项。"}, {"n": 6, "technique": "Clarifying Devices", "techniqueZh": "阐释手法", "q": "How is the phrase on the contrary used in the fourth paragraph?", "options": ["To lead into a contrast.", "To lead into a myth.", "To provide context for a quote.", "To indicate an emotion."], "answer": 0, "skillTip": "阐释手法题先看这个短语前后两句是什么关系。前句说「并非一举成功」，后句讲成员不满、跑去学习改进——前后正是转折对比。", "explain": "on the contrary 意为「恰恰相反」，作用就是引出与前文相反或对比的内容，选 a。", "why": "这个短语前后既没有神话故事（myth），也没有引用别人的话（quote），更不是在表达情绪（emotion），b、c、d 都不符合。"}]}, {"id": "day003", "day": 3, "title": "Spray, Connect, Touch", "titleZh": "喷一喷，连一连，摸一摸", "category": "Science", "categoryZh": "科学", "textForm": "Expository / 科技类说明文", "wordCount": 300, "level": "B1-B2", "techniques": ["Main Idea", "Subject Matter", "Supporting Details", "Inference", "Words in Context", "Text Form"], "intro": "本篇是《超强英语阅读训练 2》Day 3，介绍一项叫 Electrick 的新发明：一种能把任何表面变成触摸屏的导电喷漆。属于科技类说明文，结构很特别——每一大段都用一个问题开头（是什么？怎么用？能干嘛？真的行吗？），再用一段话回答。读这类文章，抓住「问句即段落主题」，就抓住了全文骨架。", "passages": [{"en": "Touchscreen technology is commonplace nowadays. It's on our phones, on our TV sets, and on our laptops. At the moment, though, touchscreen technology is limited mostly to small, flat surfaces like phone or computer screens. It isn't really suitable for large or irregular-shaped objects, like toys or living room walls, for example. However, a new invention called Electrick is set to change all that. It could be the first step in turning any surface into a working, interactive touchscreen.", "zh": "如今，触屏技术已经很普遍了。它出现在我们的手机上、电视机上、笔记本电脑上。不过目前，触屏技术大多还局限在像手机、电脑屏幕这样又小又平的表面上。它并不太适合大的或者形状不规则的物体，比如玩具或客厅的墙。然而，一项名叫 Electrick 的新发明将改变这一切。它可能成为把任何表面都变成可用的交互式触屏的第一步。", "note": "开头先扬后抑再扬：commonplace（很普遍）→ though（不过，指出局限）→ However（然而，引出发明）。看到 However 要警觉：后面才是作者真正想说的话。interactive（交互的）是本段关键词，呼应第 5 题。"}, {"en": "So, what is Electrick exactly, and how does it work? Essentially, Electrick is a conductive spray paint. You spray it on something and send a small electric charge through the object. The electrodes attached to the object then detect where you touch. Though it's not quite as accurate as the touchscreen on your smartphone or laptop, it can detect your finger within about a centimeter. It's also durable, able to retain its sensitivity over hundreds and hundreds of uses. It's not yet known how well it will work under conditions like rain or electromagnetic interference, but it's early days, yet.", "zh": "那么，Electrick 到底是什么，它又是怎么工作的呢？本质上，Electrick 是一种导电喷漆。你把它喷在某个东西上，再让一股小电流通过这个物体。附着在物体上的电极就能探测到你触摸的位置。虽然它不如你手机或笔记本电脑上的触屏那么精确，但它能把你手指的位置定位到大约一厘米以内。它还很耐用，经过成百上千次使用仍能保持灵敏度。它在下雨或电磁干扰等条件下表现如何还不得而知，不过现在还处于早期阶段嘛。", "note": "问句开头：「是什么 + 怎么工作」= 本段主题。Essentially（本质上）后面那句话就是定义，定义句最爱出题。注意两个 Though/ yet 转折：说优点（精确到一厘米、耐用）的同时也坦白不足（怕雨怕干扰）——作者很客观。"}, {"en": "So what exactly could the applications of this spray-on touchscreen be? Think about it—you could place shortcuts to your TV's functions on your favorite chair or coffee table. You could turn something like a map into an interactive learning device. How about programming your electric guitar with different sound effects? Then simply turn them on by touching different places on the instrument's body. You could customize toys, your house, your car—anything!—to respond to your touch.", "zh": "那么，这种喷涂式触屏究竟能有哪些应用呢？想想看——你可以把电视功能的快捷键设在你最喜欢的椅子或咖啡桌上。你可以把地图之类的东西变成一个交互式学习工具。给你的电吉他编上不同音效怎么样？然后只要摸一摸琴身的不同位置，就能开启它们。你可以定制你的玩具、你的房子、你的车——任何东西！——让它们对你的触摸做出反应。", "note": "又是问句开头：「能应用在哪？」接着一连串 you could 排比举例（椅子、地图、吉他、玩具、房子、车），例子越多越说明应用前景广——为第 1 题的「great future potential」埋下伏笔。破折号 —anything!— 是强调插入语。"}, {"en": "Of course, you must be asking yourself, is it really possible to make anything touch-sensitive? In a word, yes. Electrick technology is not only compatible with traditional manufacturing methods such as spray-coating and casting. It works with newer, state-of-the-art technology like 3-D printing, too. The technology might be brand new, but the possibilities appear to be endless.", "zh": "当然，你一定在问自己：真的能让任何东西都变得可触摸感应吗？一句话：能。Electrick 技术不仅与喷涂、铸造等传统制造工艺兼容，也能与 3D 打印这类更新、最前沿的技术配合。这项技术也许还很新，但它的可能性看起来是无穷无尽的。", "note": "最后一个问句：「真的可行吗？」In a word, yes（一句话：能）回答得干脆利落，作者的乐观态度跃然纸上（呼应第 4 题）。结尾句 The technology might be brand new, but the possibilities appear to be endless 是全文中心句——承认「新」，更强调「前途无量」。"}], "vocab": [{"word": "touchscreen", "phon": "/ˈtʌtʃskriːn/", "pos": "n.", "def": "a screen that you can touch to give instructions to a device", "zh": "触摸屏", "sentence": "Touchscreen technology is commonplace nowadays."}, {"word": "commonplace", "phon": "/ˈkɒmənpleɪs/", "pos": "adj.", "def": "very common; not unusual or surprising", "zh": "普遍的；司空见惯的", "sentence": "Touchscreen technology is commonplace nowadays."}, {"word": "be limited to", "phon": "/bɪ ˈlɪmɪtɪd tuː/", "pos": "phr.", "def": "to exist only within a certain range", "zh": "局限于；仅限于", "sentence": "Touchscreen technology is limited mostly to small, flat surfaces."}, {"word": "irregular-shaped", "phon": "/ɪˈreɡjələ ʃeɪpt/", "pos": "adj.", "def": "having a shape that is not even or regular", "zh": "形状不规则的", "sentence": "It isn't really suitable for large or irregular-shaped objects."}, {"word": "interactive", "phon": "/ˌɪntərˈæktɪv/", "pos": "adj.", "def": "responding to a person's actions or input", "zh": "交互式的；互动的", "sentence": "Turning any surface into a working, interactive touchscreen."}, {"word": "essentially", "phon": "/ɪˈsenʃəli/", "pos": "adv.", "def": "basically; when you consider the most important part", "zh": "本质上；基本上", "sentence": "Essentially, Electrick is a conductive spray paint."}, {"word": "conductive", "phon": "/kənˈdʌktɪv/", "pos": "adj.", "def": "able to carry electricity or heat", "zh": "导电的；导热性的", "sentence": "Essentially, Electrick is a conductive spray paint."}, {"word": "electrode", "phon": "/ɪˈlektrəʊd/", "pos": "n.", "def": "a small piece of metal that electricity passes through", "zh": "电极", "sentence": "The electrodes attached to the object then detect where you touch."}, {"word": "detect", "phon": "/dɪˈtekt/", "pos": "v.", "def": "to notice or discover something", "zh": "探测；察觉", "sentence": "It can detect your finger within about a centimeter."}, {"word": "accurate", "phon": "/ˈækjərət/", "pos": "adj.", "def": "correct and exact in every detail", "zh": "精确的；准确的", "sentence": "It's not quite as accurate as the touchscreen on your smartphone."}, {"word": "durable", "phon": "/ˈdjʊərəbl/", "pos": "adj.", "def": "able to last a long time without being damaged", "zh": "耐用的；持久的", "sentence": "It's also durable, able to retain its sensitivity over hundreds of uses."}, {"word": "retain", "phon": "/rɪˈteɪn/", "pos": "v.", "def": "to keep or continue to have something", "zh": "保持；保留", "sentence": "Able to retain its sensitivity over hundreds and hundreds of uses."}, {"word": "electromagnetic interference", "phon": "/ɪˌlektrəʊmæɡˈnetɪk ˌɪntəˈfɪərəns/", "pos": "n. phr.", "def": "disturbance caused by electromagnetic waves that affects electronic devices", "zh": "电磁干扰", "sentence": "Under conditions like rain or electromagnetic interference."}, {"word": "application", "phon": "/ˌæplɪˈkeɪʃn/", "pos": "n.", "def": "a practical use of something", "zh": "应用；用途", "sentence": "What exactly could the applications of this spray-on touchscreen be?"}, {"word": "customize", "phon": "/ˈkʌstəmaɪz/", "pos": "v.", "def": "to change something to suit a particular person or purpose", "zh": "定制；按需要改造", "sentence": "You could customize toys, your house, your car—anything!"}, {"word": "compatible", "phon": "/kəmˈpætəbl/", "pos": "adj.", "def": "able to work or be used together", "zh": "兼容的；可共用的", "sentence": "Electrick technology is compatible with traditional manufacturing methods."}, {"word": "state-of-the-art", "phon": "/ˌsteɪt əv ði ˈɑːt/", "pos": "adj.", "def": "using the most modern and advanced methods or ideas", "zh": "最先进的；最前沿的", "sentence": "It works with newer, state-of-the-art technology like 3-D printing, too."}, {"word": "brand new", "phon": "/brænd njuː/", "pos": "adj. phr.", "def": "completely new", "zh": "崭新的；全新的", "sentence": "The technology might be brand new, but the possibilities appear to be endless."}, {"word": "endless", "phon": "/ˈendləs/", "pos": "adj.", "def": "seeming to have no end or limit", "zh": "无穷无尽的", "sentence": "The possibilities appear to be endless."}], "hardSentences": [{"en": "It could be the first step in turning any surface into a working, interactive touchscreen.", "structure": "主干是 It could be the first step（它可能是第一步）。in turning... 是介词短语作后置定语，说明「哪方面的第一步」；turning A into B 是动名词短语，意为「把 A 变成 B」。working, interactive 两个形容词并列修饰 touchscreen。记句型：the first step in doing sth（做某事的第一步）。", "zh": "它可能成为把任何表面都变成可用的交互式触屏的第一步。"}, {"en": "Though it's not quite as accurate as the touchscreen on your smartphone or laptop, it can detect your finger within about a centimeter.", "structure": "Though 引导让步状语从句，意为「虽然……，但是……」（注意英语里 though 和 but 不同时用）。从句里是 not as + 形容词原级 + as 结构：「不如……那么精确」。主句中 within about a centimeter 表示「误差在一厘米以内」。", "zh": "虽然它不如你手机或笔记本电脑上的触屏那么精确，但它能把你手指的位置定位到大约一厘米以内。"}, {"en": "It's not yet known how well it will work under conditions like rain or electromagnetic interference, but it's early days, yet.", "structure": "前半句 It 是形式主语，真正的主语是后面的 how well it will work...（它在……条件下表现如何），也就是「……还不得而知」。under conditions like... 表示「在像……这样的条件下」。后半句 it's early days 是习语，意思是「还为时过早／才刚开始」。", "zh": "它在下雨或电磁干扰等条件下表现如何还不得而知，不过现在还处于早期阶段嘛。"}], "questions": [{"n": 1, "technique": "Main Idea", "techniqueZh": "中心思想", "q": "What is the author's main point?", "options": ["Spray-on touchscreens are not yet fully developed.", "Touchscreens are commonplace nowadays.", "Spray-on touchscreens have great future potential.", "Spray-on touchscreens are actually quite durable."], "answer": 2, "skillTip": "中心思想题要抓「作者最想让你记住的那句话」，往往藏在首段末和尾段。本文尾段点明：the possibilities appear to be endless（可能性无穷无尽）——这就是作者的核心观点。技巧：开头结尾找观点句，中间段落都是为它服务的。", "explain": "作者从触屏的局限讲起，引出 Electrick 这项发明，中间大篇幅讲它能用在椅子、地图、吉他、玩具、房子、汽车上，最后总结「技术虽新，但可能性无穷无尽」。全文的重心是展望它的巨大前景，所以选 c。", "why": "a「还没完全成熟」只是文中一个细节（怕雨怕干扰），不是作者想强调的重点；b「触屏如今很普遍」只是第一段开头的背景铺垫，Electrick 才是主角；d「很耐用」同样只是第二段提到的一个优点细节。三个选项都是「细节冒充中心」。"}, {"n": 2, "technique": "Subject Matter", "techniqueZh": "主题", "q": "What is the article about?", "options": ["A new invention.", "A famous inventor.", "Interior decoration.", "The future of smartphone."], "answer": 0, "skillTip": "主题题问「文章讲的是什么（一句话概括对象）」，比中心思想题更宽泛。方法：看全文反复出现的核心名词——本文从头至尾都在讲 Electrick 这项发明：它是什么、怎么工作、能用在哪、可不可行。", "explain": "四个段落分别回答了「Electrick 是什么」「怎么工作」「有什么应用」「是否真的可行」，全部围绕一项新发明展开，所以选 a。", "why": "b「一位著名发明家」——文章根本没有介绍任何发明家本人；c「室内装饰」——文章提到墙和椅子只是应用例子，不是主题；d「智能手机的未来」——手机只是用来做对比的参照物，文章主角是喷涂触屏而非手机。"}, {"n": 3, "technique": "Supporting Details", "techniqueZh": "支持性细节", "q": "Which is true about spray-on touchscreens?", "options": ["They're more accurate than conventional touchscreens.", "They can be used on irregular-shaped objects.", "They are completely waterproof.", "They can be used only on small objects."], "answer": 1, "skillTip": "细节题要带着选项回原文逐一定位核对，特别小心 more...than、only、completely 这类「绝对化/比较级」词——干扰项最爱在这里偷换原文。", "explain": "第一段说传统触屏不适合 irregular-shaped objects（形状不规则的物体），而 Electrick 正是来改变这一点的——可以把玩具、墙、吉他琴身等各种不规则表面变成触屏，所以 b 正确。", "why": "a 与原文相反——第二段明确说 it's not quite as accurate as the touchscreen on your smartphone（不如手机触屏精确）；c 与原文相反——它在雨中的表现还不得而知，谈不上完全防水；d 与原文相反——恰恰是因为它不限于小物体、能用于大的不规则表面，这项发明才有意义。"}, {"n": 4, "technique": "Inference", "techniqueZh": "推理", "q": "Which can best describe the author's attitude towards spray-on touchscreens?", "options": ["He's afraid of them and wants to see them stopped.", "He thinks they will only be available for rich people.", "He's looking forward to them becoming more popular.", "He's not really interested in them."], "answer": 2, "skillTip": "态度推理题要靠「语气词和结论句」推断，原文不会直接说「我很期待」。抓这些信号：感叹号（—anything!—）、干脆的肯定（In a word, yes）、结尾褒义总结（possibilities appear to be endless）——都指向积极期待。", "explain": "作者用大量笔墨畅想各种有趣的应用（吉他、玩具、汽车），对「真的可行吗」给出响亮的 yes，结尾更是说可能性无穷无尽。通篇语气兴奋乐观，可见他期待这项技术普及，所以选 c。", "why": "a「害怕并希望叫停」与全文语气完全相反；b「只给富人用」原文从未提及价格或人群；d「不感兴趣」也与作者热情洋溢的描写矛盾——不感兴趣的人不会写这么多应用场景。"}, {"n": 5, "technique": "Words in Context", "techniqueZh": "语境词义", "q": "In the first paragraph, the author mentions an interactive surface. If something is interactive, what does it do?", "options": ["Breaks down easily.", "Refuses to follow instructions.", "Gives up when things get hard.", "Responds to a person's input"], "answer": 3, "skillTip": "语境词义题：先拆词（inter- = 相互之间，active = 活动的），再回原文找上下文线索。文中后文说 customize toys...to respond to your touch（让玩具对你的触摸做出反应），正好解释了 interactive 的意思。", "explain": "interactive 本义是「互动的、交互的」：你摸它一下，它就有反应——即对使用者的输入做出回应。文中「detect where you touch」「respond to your touch」都在印证这个意思，所以选 d。", "why": "a「容易坏」、b「拒绝听从指令」、c「遇到困难就放弃」都把 interactive 误解成了拟人化的负面性格，与「你碰它、它有反应」的语境完全无关。"}, {"n": 6, "technique": "Text Form", "techniqueZh": "写作文体", "q": "How does the author structure the article?", "options": ["As a series of questions and answers.", "As a series of events in a sequence.", "As a series of personal stories.", "As a series of causes and effects."], "answer": 0, "skillTip": "文体结构题要退后一步看全文的「组织方式」，别盯着单句。扫一眼每段开头：So, what is Electrick exactly...? / So what exactly could the applications...be? / is it really possible...? ——每段都是「先问后答」，结构一目了然。", "explain": "第二段以「Electrick 是什么、怎么工作？」开篇，第三段以「它能有哪些应用？」开篇，第四段以「真的可行吗？」开篇——每一段都是先抛出问题、再用整段回答，所以全文是「一问一答」式结构，选 a。", "why": "b「按时间顺序的事件」——文章没有讲发展过程的时间线；c「个人故事」——全文没有讲述任何人的亲身经历；d「因果链」——文章不是在分析某个现象的原因和结果，而是在逐项介绍一项发明。"}]}, {"id": "day004", "day": 4, "title": "The World's First Bridal Shower", "titleZh": "世界上最早的「婚前送礼会」", "category": "Culture", "categoryZh": "文化", "textForm": "Expository / 文化类说明文", "wordCount": 300, "level": "B1-B2", "techniques": ["Main Idea", "Subject Matter", "Supporting Details", "Inference", "Words in Context", "Cause and Effect"], "intro": "本篇是《超强英语阅读训练 2》Day 4，介绍印度婚礼前的 Mehndi 仪式——用指甲花颜料在新娘手上画彩绘的传统。属于文化类说明文：按「是什么 → 历史起源 → 具体流程 → 古今变化」介绍一种风俗。读这类文章，抓住「习俗的名字 + 时间 + 人们做什么」这三样，就抓住了全文骨架。", "passages": [{"en": "What's the first thing that comes to mind when you think of Indian weddings? It's probably the elegant designs painted on the bride's body. This is called the Mehndi ceremony, and some say it's the \"oldest bridal shower in the world.\"", "zh": "一想到印度婚礼，你脑海里冒出的第一件事是什么？很可能是画在新娘身上的精美图案。这就叫 Mehndi（曼海蒂）仪式，有人说它是「世界上最早的婚前送礼会」。", "note": "用问句开头勾住读者，接着马上给出答案和本文主角：Mehndi ceremony。标题里的 bridal shower（婚前送礼会：亲友们为即将出嫁的新娘办的庆祝聚会）是个文化概念，文中用「oldest bridal shower」来类比这个印度传统。"}, {"en": "During the Mehndi ceremony, a bride's hands and arms are decorated with a colorful paste made from henna plants. Henna has been used for body decoration for thousands of years. The Egyptian Pharaoh Cleopatra, who lived from 69 B.C. to 30 B.C., is said to have used henna to paint her fingernails. The Mehndi ceremony is more recent, but it still traces its roots back to the 15th century.", "zh": "在 Mehndi 仪式上，新娘的双手和手臂会用一种用指甲花植物做成的彩色颜料来装饰。指甲花用于人体装饰已有几千年的历史。据说生活在公元前 69 年到公元前 30 年的埃及法老克里奥帕特拉，就曾用指甲花来染指甲。Mehndi 仪式出现得晚一些，但它的根源也能追溯到 15 世纪。", "note": "第二段讲历史：for thousands of years → 69 B.C. to 30 B.C. → the 15th century，时间词层层推进。trace its roots back to（把根源追溯到）是重点短语，第 5 题就考它。"}, {"en": "The Mehndi ceremony takes place on the night before the wedding. It's known for being fun and relaxing, unlike many other wedding ceremonies, which are more formal. The ceremony is a chance for the bride to spend time with close family and friends. Traditionally, it would be the last chance before the bride leaves to live with her husband's family. Guests of the ceremony come over to laugh, tell stories, sing, and dance. All the while, the bride's hands and arms are painted with elaborate henna designs. After the evening is over, the bride remains home until her wedding begins the next day.", "zh": "Mehndi 仪式在婚礼的前一晚举行。它以好玩、放松著称，和其他许多更正式的婚礼仪式很不一样。这个仪式是新娘和亲密的家人朋友共度时光的机会。按传统，这也是新娘离开家、去和丈夫家人一起生活之前的最后一次机会。来参加仪式的客人们聚在一起欢笑、讲故事、唱歌、跳舞。与此同时，新娘的双手和手臂被画上精致的指甲花图案。夜晚结束后，新娘就待在家里，直到第二天婚礼开始。", "note": "本段讲流程，是全文的「戏肉」：时间（婚礼前一晚）+ 氛围（fun and relaxing，注意 unlike 引出的对比）+ 做什么（laugh, tell stories, sing, and dance 一连串动词，第 3 题考这里）。画重点：来参加的是新娘一方的亲友，全文没提新郎。"}, {"en": "Families approach the Mehndi ceremony differently. Sometimes the ceremony is very low-key: a few loved ones gather for a \"girls' night in.\" Other times, it's a big event, with an outside venue and a long guest list.", "zh": "各家办 Mehndi 仪式的方式也不一样。有时仪式非常低调：几位亲近的人聚在一起，过一个「女生之夜」。有时则是一场大活动，有外面的场地和长长的宾客名单。", "note": "Sometimes... Other times...（有时……有时……）是经典的对比句型，说明规模可大可小。girls' night in 呼应了「新娘的女性亲友聚会」这一性质——新郎不参加，为第 4 题的推理埋下线索。"}, {"en": "Who does the actual body painting? It used to be any neighborhood auntie with experience and a steady hand. But nowadays, brides tend to hire professionals to do the henna painting. These pros will paint peacocks, flowers, Islamic patterns, and representations of the bride and groom. Their designs are also getting more complicated and more beautiful over time. Some of them have even begun to use glitter and different colors of henna.", "zh": "那实际动手画彩绘的是谁呢？过去，随便哪位有经验、手又稳的街坊阿姨都可以。但如今，新娘们倾向于请专业人士来画指甲花彩绘。这些行家会画孔雀、花朵、伊斯兰风格的图案，还有新郎新娘的形象。他们的设计也随着时间变得越来越复杂、越来越漂亮。其中一些人甚至开始用上亮粉和不同颜色的指甲花颜料。", "note": "问句开头，然后 It used to be... But nowadays... 构成今昔对比（过去街坊阿姨画 → 现在请专业画师）。对比之后就是结果：图案越来越复杂精美——这正是第 6 题「请专业画师带来的效果」的出处。"}], "vocab": [{"word": "bridal shower", "phon": "/ˈbraɪdl ˈʃaʊə/", "pos": "n. phr.", "def": "a party for a woman who is about to get married", "zh": "（为新娘办的）婚前送礼会", "sentence": "Some say it's the \"oldest bridal shower in the world.\""}, {"word": "come to mind", "phon": "/kʌm tuː maɪnd/", "pos": "phr.", "def": "to be the first thing you think of", "zh": "浮现在脑海里；想到", "sentence": "What's the first thing that comes to mind when you think of Indian weddings?"}, {"word": "elegant", "phon": "/ˈelɪɡənt/", "pos": "adj.", "def": "beautiful and graceful in style", "zh": "精美的；雅致的", "sentence": "It's probably the elegant designs painted on the bride's body."}, {"word": "ceremony", "phon": "/ˈserəməni/", "pos": "n.", "def": "a formal event performed on special occasions", "zh": "仪式；典礼", "sentence": "This is called the Mehndi ceremony."}, {"word": "henna", "phon": "/ˈhenə/", "pos": "n.", "def": "a reddish-brown dye made from a plant, used to color skin and hair", "zh": "指甲花（颜料）", "sentence": "A colorful paste made from henna plants."}, {"word": "decorate", "phon": "/ˈdekəreɪt/", "pos": "v.", "def": "to make something look more attractive by adding things to it", "zh": "装饰；装点", "sentence": "A bride's hands and arms are decorated with a colorful paste."}, {"word": "pharaoh", "phon": "/ˈfeərəʊ/", "pos": "n.", "def": "a ruler of ancient Egypt", "zh": "法老（古埃及统治者）", "sentence": "The Egyptian Pharaoh Cleopatra lived from 69 B.C. to 30 B.C."}, {"word": "trace one's roots back to", "phon": "/treɪdz ruːts bæk tuː/", "pos": "phr.", "def": "to find the origin of something in the past", "zh": "把根源追溯到……", "sentence": "It still traces its roots back to the 15th century."}, {"word": "take place", "phon": "/teɪk pleɪs/", "pos": "phr.", "def": "to happen, especially at a planned time", "zh": "举行；发生", "sentence": "The Mehndi ceremony takes place on the night before the wedding."}, {"word": "formal", "phon": "/ˈfɔːml/", "pos": "adj.", "def": "following official rules; serious and proper", "zh": "正式的", "sentence": "Unlike many other wedding ceremonies, which are more formal."}, {"word": "elaborate", "phon": "/ɪˈlæbərət/", "pos": "adj.", "def": "very detailed and carefully made", "zh": "精致复杂的；精心制作的", "sentence": "The bride's hands and arms are painted with elaborate henna designs."}, {"word": "approach", "phon": "/əˈprəʊtʃ/", "pos": "v.", "def": "to deal with something in a particular way", "zh": "对待；处理（此处义）", "sentence": "Families approach the Mehndi ceremony differently."}, {"word": "low-key", "phon": "/ˌləʊ ˈkiː/", "pos": "adj.", "def": "quiet, small and not attracting attention", "zh": "低调的；小规模的", "sentence": "Sometimes the ceremony is very low-key."}, {"word": "venue", "phon": "/ˈvenjuː/", "pos": "n.", "def": "the place where an event is held", "zh": "（活动的）场地；场所", "sentence": "It's a big event, with an outside venue and a long guest list."}, {"word": "a steady hand", "phon": "/ə ˈstedi hænd/", "pos": "n. phr.", "def": "a hand that does not shake; skill in careful work", "zh": "稳健的手（艺）", "sentence": "It used to be any neighborhood auntie with experience and a steady hand."}, {"word": "tend to", "phon": "/tend tuː/", "pos": "phr.", "def": "to be likely to do something; usually do something", "zh": "倾向于；往往会", "sentence": "Nowadays, brides tend to hire professionals to do the henna painting."}, {"word": "complicated", "phon": "/ˈkɒmplɪkeɪtɪd/", "pos": "adj.", "def": "made of many parts; difficult to do or understand", "zh": "复杂的", "sentence": "Their designs are getting more complicated and more beautiful over time."}, {"word": "glitter", "phon": "/ˈɡlɪtə/", "pos": "n.", "def": "tiny shiny pieces used for decoration", "zh": "亮粉；闪光装饰片", "sentence": "Some of them have even begun to use glitter and different colors of henna."}], "hardSentences": [{"en": "The Egyptian Pharaoh Cleopatra, who lived from 69 B.C. to 30 B.C., is said to have used henna to paint her fingernails.", "structure": "主干是 Cleopatra is said to have used henna（据说克里奥帕特拉用过指甲花）。中间两个逗号之间的 who lived from 69 B.C. to 30 B.C. 是非限制性定语从句，插入补充「她生活的年代」，读的时候可以先跳过，抓主干再回头补细节。句型 sb. is said to have done sth = 据说某人做过某事。", "zh": "据说生活在公元前 69 年到公元前 30 年的埃及法老克里奥帕特拉，曾用指甲花来染指甲。"}, {"en": "It's known for being fun and relaxing, unlike many other wedding ceremonies, which are more formal.", "structure": "主干 It's known for being fun and relaxing：be known for = 以……著称，for 后面接动名词 being。unlike...（不像……）是介词短语作对比；句尾的 which are more formal 是非限制性定语从句，补充说明 other ceremonies 的特点。一句话里有两层对比：fun and relaxing ↔ formal。", "zh": "它以好玩、放松著称，和其他许多更正式的婚礼仪式不一样。"}, {"en": "It used to be any neighborhood auntie with experience and a steady hand. But nowadays, brides tend to hire professionals to do the henna painting.", "structure": "这是今昔对比句组：used to do/be 表示「过去常常（现在不了）」，nowadays（如今）引出转折。前后对仗：neighborhood auntie（街坊阿姨）↔ professionals（专业人士）。with experience and a steady hand 是介词短语作后置定语，形容阿姨「有经验、手稳」。", "zh": "过去，随便哪位有经验、手又稳的街坊阿姨都能画；但如今，新娘们倾向于请专业人士来画指甲花彩绘。"}], "questions": [{"n": 1, "technique": "Main Idea", "techniqueZh": "中心思想", "q": "Which sentence is closest to the main point?", "options": ["The Mehndi ceremony is a relaxed and fun tradition.", "Families and friends are important to the bride.", "Women in India like to have parties.", "There are lots of professional henna painters now."], "answer": 0, "skillTip": "中心思想题要找「作者花了最多笔墨、最想让你记住」的那一点。本文从标题（world's first bridal shower）到流程段（fun and relaxing）都在强调：这是一个轻松欢乐的婚前庆祝传统。抓关键词复现——fun、relaxing、laugh、sing、dance 一路贯穿。", "explain": "全文围绕 Mehndi 仪式展开：它是婚礼前一晚的庆祝活动，以「好玩、放松」著称，亲友欢聚、新娘手绘彩绘。最能概括全文的就是 a「Mehndi 仪式是一个轻松有趣的传统」。", "why": "b「家人朋友对新娘很重要」只是仪式的一方面，不是全文中心；c「印度女人爱开派对」把传统仪式说成了普通派对，以偏概全；d「现在有很多专业彩绘师」只是最后一段的今昔对比细节，撑不起全文。"}, {"n": 2, "technique": "Subject Matter", "techniqueZh": "主题", "q": "What does this passage describe?", "options": ["A special dress.", "A pre-wedding event.", "A type of colorful paste.", "A dinner party."], "answer": 1, "skillTip": "主题题问「这篇文章介绍的是什么」，答案要足够「大」——能装下全文所有段落。检验方法：把选项放回每一段，看看是不是每段都在说它。", "explain": "Mehndi 仪式在婚礼前一夜举行，是新娘与亲友的庆祝聚会——本质上是「一个婚前活动」，所以选 b。历史、流程、画师各段都在讲这个活动。", "why": "a「一件特别的礼服」全文没提服装；c「一种彩色颜料」——指甲花颜料只是仪式上用的工具，不是文章主题；d「一顿晚宴」——文章没讲吃饭，仪式也不是晚宴。"}, {"n": 3, "technique": "Supporting Details", "techniqueZh": "支持性细节", "q": "Based on the passage, which is NOT a part of the Mehndi ceremony?", "options": ["Singing.", "Dancing.", "Body painting.", "Cooking a meal."], "answer": 3, "skillTip": "NOT 题是反向细节题：三个选项在原文里找得到，找不到的那个才是答案。回第三段定位这句：Guests... come over to laugh, tell stories, sing, and dance... the bride's hands and arms are painted——逐个划掉即可。", "explain": "原文明确提到客人们唱歌（sing）、跳舞（dance），新娘手上画彩绘（body painting），唯独没有任何「做饭」的环节，所以选 d。", "why": "a、b 直接出自 laugh, tell stories, sing, and dance；c 对应 the bride's hands and arms are painted with elaborate henna designs。三个都能在原文坐实，剩下的 d 就是 NOT 的答案。"}, {"n": 4, "technique": "Inference", "techniqueZh": "推理", "q": "Which of the following is probably true about the Mehndi ceremony?", "options": ["It lasts for a month.", "The groom does not attend.", "Most brides refuse to take part.", "It is a very expensive event."], "answer": 1, "skillTip": "推理题选「原文没直说、但能合理推出」的选项。线索在第四段：a few loved ones gather for a \"girls' night in\"（女生之夜）——来参加的是新娘的女性亲友；全文也只说 bride 和 guests，从没提新郎到场。由此可推：新郎不参加。", "explain": "仪式是新娘和女性亲友的聚会（girls' night in），而且传统上这是新娘离家去丈夫家前最后一次和自家人团聚——新郎不在场符合整个语境，所以 b 是合理推断。", "why": "a「持续一个月」——原文说的是婚礼前一晚（the night before），第二天就结婚了；c「多数新娘拒绝参加」——恰恰相反，这是重要传统；d「非常昂贵」——原文说有时只是低调的 girls' night in，谈不上昂贵。"}, {"n": 5, "technique": "Words in Context", "techniqueZh": "语境词义", "q": "What does it mean to trace something's roots back, as mentioned in the second paragraph?", "options": ["To inspire something.", "To be the opposite of something.", "To come from something.", "To hurt something."], "answer": 2, "skillTip": "语境词义题靠上下文线索：第二段整段都在讲历史——for thousands of years、69 B.C. to 30 B.C.、the 15th century。roots（根）+ back（往回）指向「起源、来自」。把选项逐个代入原句，通顺的就是答案。", "explain": "traces its roots back to the 15th century = 它的根源可以追溯到 15 世纪，也就是「它来自/起源于那个时候」，选 c。root 本义是「根」，植物的根在哪里，它就长自哪里。", "why": "a「启发某物」、b「与某物相反」、d「伤害某物」代入原句都讲不通——「把根源追溯到 15 世纪」谈的是历史起源，和启发、相反、伤害都无关。"}, {"n": 6, "technique": "Cause and Effect", "techniqueZh": "因果关系", "q": "According to the passage, which is one of the effects of brides using professional henna artists?", "options": ["The price of the Mehndi ceremony is going down.", "The Mehndi ceremony is becoming more popular overseas.", "Guests are singing and dancing during the Mehndi ceremony.", "The henna designs are becoming more complex."], "answer": 3, "skillTip": "因果题先定位「因」所在的句子：brides tend to hire professionals... 然后往下读找「果」。原文紧跟着说 Their designs are also getting more complicated and more beautiful over time——设计更复杂更漂亮，就是专业画师带来的直接效果。", "explain": "请专业画师（因）→ 图案越来越复杂精美、还开始用亮粉和彩色颜料（果）。d「彩绘设计变得更复杂」正是原文白纸黑字写出的效果，所以选 d。", "why": "a「价格下降」——请专业人士通常更贵，且原文没提价格；b「在海外更流行」——原文没提海外；c「客人唱歌跳舞」是仪式本来的环节，早在请专业画师之前就存在，不是它带来的效果。"}]}, {"id": "day005", "day": 5, "title": "Farming for the Future", "titleZh": "为未来而耕种", "category": "Science", "categoryZh": "科学", "textForm": "Expository / 科普议论型说明文", "wordCount": 330, "level": "B1-B2", "techniques": ["Main Idea", "Subject Matter", "Supporting Details", "Inference", "Words in Context", "Clarifying Devices"], "intro": "本篇是《超强英语阅读训练 2》Day 5，讲可持续农业（sustainable agriculture）：现代农业高产却埋下隐患，可持续农业用一整套做法兼顾环境、动物和农民。结构是「提出问题 → 给出方案 → 展望未来」。读这类「问题—方案」文章，抓住两个问题就行：问题是什么？方案有哪几条？每一段的答案都明明白白写在段首。", "passages": [{"en": "Farming has come a long way since seeds were first planted in Mesopotamia around 13,000 years ago. Biological, chemical, and technological inventions have increased production and decreased risk. Especially in the last sixty years, new machines, new chemicals, specialization, and government policies promoting production have turned farms into huge industrial businesses. Individual farms are larger, but the number of farms and farm workers has shrunk. We produce more food, so what's the problem?", "zh": "自从大约 13,000 年前人类在美索不达米亚播下第一批种子以来，农业已经走过了漫长的路。生物、化学和技术发明提高了产量、降低了风险。尤其在最近六十年，新机器、新化学品、专业化分工，加上鼓励增产的政府政策，把农场变成了庞大的工业化企业。单个农场越来越大，但农场和农民的数量却在减少。我们生产的粮食更多了，那问题出在哪儿呢？", "note": "开头先扬：用 has come a long way（走了很长一段路=进步巨大）肯定现代农业的成就。注意段尾的问句 what's the problem?——这是全文的转向信号，前面说得多好，后面就要说问题多大。读说明文要盯住这种自问自答。"}, {"en": "The problem is the future. Many of the developments that make farms so productive right now are actually creating terrible problems for future generations. Chemicals and fertilizers are seeping into soil and groundwater. Soil is being depleted of nutrients. Communities are collapsing as human workers are no longer needed. Family farms can't compete against big agribusiness.", "zh": "问题出在未来。许多眼下让农场高产的发展，其实正在给后代制造可怕的麻烦。化学品和化肥正渗入土壤和地下水；土壤的养分正在流失；因为不再需要人力，乡村社区正在瓦解；家庭农场竞争不过大型农业公司。", "note": "段首 The problem is the future 直接回答上段的问题——这是「问题段」。后面一口气列了四个具体问题（化学品渗漏、土壤流失、社区瓦解、家庭农场落败），全是短句排比，节奏很快，作者故意让你感到问题又多又急。"}, {"en": "The sustainable agriculture movement wants to stop harmful industrial farming. It uses farmland in a way that doesn't use it up. Instead of maximizing production now, sustainable farms operate in a way that allows them to continue to farm for years to come. Sustainable agriculture seeks to protect the environment of farms and their surroundings, respect the health of farm animals, provide farmers with a fair wage, and ensure that workers are respected and paid fairly.", "zh": "可持续农业运动想要制止有害的工业化农业。它以一种不会把地力耗尽的方式使用耕地。可持续农场不追求眼下产量最大化，而是让土地在未来很多年都能继续耕种。可持续农业力求做到：保护农场及周边的环境、尊重农场动物的健康、给农民提供公平的工资，并确保工人受到尊重、报酬合理。", "note": "主角登场：sustainable agriculture（可持续农业）。段尾四个并列动词 protect / respect / provide / ensure 是它的四大目标——记笔记时就记这四个词，第 1 题和第 3 题都跟这里有关。use up（用光）和 maximize（最大化）是常考搭配。"}, {"en": "Sustainable farms do this in a few ways. They operate organically or minimize their use of chemicals and non-renewable resources. They keep waste products on their land instead of letting them spread. They grow and rotate diverse crops so that soil is replenished rather than depleted. They treat animals humanely and avoid giving them antibiotics and other drugs (that may pass to humans and the environment around the farm). They employ humans over machines whenever possible.", "zh": "可持续农场用几种方法做到这一点。它们采用有机耕作，或尽量少用化学品和不可再生资源；它们把废弃物留在自己的土地上，不让其扩散；它们种植并轮作多种作物，让土壤得到补充而不是被耗尽；它们人道的对待动物，避免给动物使用抗生素和其他药物（这些药物可能传给人类和农场周围的环境）；只要有可能，它们就雇人而不是用机器。", "note": "do this in a few ways 是总起句，后面五个 They... 排比就是五条具体做法——第 2 题考「这篇文章讲的是什么」，答案 a set of practices（一整套做法）就来自这一段。注意 replenish 和 deplete 这对反义词同框出现。"}, {"en": "As the problems of industrial farming become clear, sustainable agriculture becomes more appealing. Countries are creating policies to promote it, and organizations are rewarding farms for operating sustainably. With farming, as with so much else, we are discovering that bigger, faster, and more is not necessarily better.", "zh": "随着工业化农业的问题日益显现，可持续农业变得越来越有吸引力。各国正在制定政策来推广它，一些组织也在奖励可持续经营的农场。在农业这件事上——和许多其他事情一样——我们正在发现：更大、更快、更多，并不一定更好。", "note": "结尾段先讲趋势（政府出政策、组织给奖励），最后一句点出全文立意：bigger, faster, and more is not necessarily better。这是作者最想让你带走的一句话，也是升华主题的典型收尾。"}], "vocab": [{"word": "sustainable", "phon": "/səˈsteɪnəbl/", "pos": "adj.", "def": "able to continue for a long time without using up resources or causing harm", "zh": "可持续的", "sentence": "The sustainable agriculture movement wants to stop harmful industrial farming."}, {"word": "agriculture", "phon": "/ˈæɡrɪkʌltʃə/", "pos": "n.", "def": "the practice of farming, including growing crops and raising animals", "zh": "农业", "sentence": "Sustainable agriculture seeks to protect the environment of farms and their surroundings."}, {"word": "fertilizer", "phon": "/ˈfɜːtəlaɪzə/", "pos": "n.", "def": "a substance put on soil to help plants grow", "zh": "肥料；化肥", "sentence": "Chemicals and fertilizers are seeping into soil and groundwater."}, {"word": "seep", "phon": "/siːp/", "pos": "v.", "def": "to flow slowly through small holes or spaces", "zh": "渗漏；慢慢渗入", "sentence": "Chemicals and fertilizers are seeping into soil and groundwater."}, {"word": "deplete", "phon": "/dɪˈpliːt/", "pos": "v.", "def": "to reduce the amount or quality of something; to use up", "zh": "耗尽；使减少", "sentence": "Soil is being depleted of nutrients."}, {"word": "nutrient", "phon": "/ˈnjuːtriənt/", "pos": "n.", "def": "a substance in food or soil that helps living things grow", "zh": "养分；营养物质", "sentence": "Soil is being depleted of nutrients."}, {"word": "agribusiness", "phon": "/ˈæɡrɪbɪznəs/", "pos": "n.", "def": "farming done as a large business by big companies", "zh": "大型农业公司；农业综合企业", "sentence": "Family farms can't compete against big agribusiness."}, {"word": "maximize", "phon": "/ˈmæksɪmaɪz/", "pos": "v.", "def": "to make something as large or great as possible", "zh": "使最大化", "sentence": "Instead of maximizing production now, sustainable farms operate in a way that allows them to continue to farm for years to come."}, {"word": "organically", "phon": "/ɔːˈɡænɪkli/", "pos": "adv.", "def": "in a way that does not use chemical fertilizers or pesticides", "zh": "（种植）有机地；不用化肥农药地", "sentence": "They operate organically or minimize their use of chemicals and non-renewable resources."}, {"word": "non-renewable", "phon": "/ˌnɒn rɪˈnjuːəbl/", "pos": "adj.", "def": "that cannot be replaced after being used, like coal or oil", "zh": "不可再生的", "sentence": "They operate organically or minimize their use of chemicals and non-renewable resources."}, {"word": "rotate", "phon": "/rəʊˈteɪt/", "pos": "v.", "def": "to change crops grown on the same land in a regular order", "zh": "轮作；轮换", "sentence": "They grow and rotate diverse crops so that soil is replenished rather than depleted."}, {"word": "diverse", "phon": "/daɪˈvɜːs/", "pos": "adj.", "def": "of many different kinds", "zh": "多种多样的", "sentence": "They grow and rotate diverse crops so that soil is replenished rather than depleted."}, {"word": "replenish", "phon": "/rɪˈplenɪʃ/", "pos": "v.", "def": "to fill something up again; to bring back what was used", "zh": "补充；重新填满", "sentence": "They grow and rotate diverse crops so that soil is replenished rather than depleted."}, {"word": "humanely", "phon": "/hjuːˈmeɪnli/", "pos": "adv.", "def": "in a kind way that does not cause suffering", "zh": "人道地；仁慈地", "sentence": "They treat animals humanely and avoid giving them antibiotics and other drugs."}, {"word": "antibiotics", "phon": "/ˌæntibaɪˈɒtɪks/", "pos": "n. (pl.)", "def": "drugs that kill bacteria and cure infections", "zh": "抗生素", "sentence": "They treat animals humanely and avoid giving them antibiotics and other drugs."}, {"word": "fair wage", "phon": "/feə weɪdʒ/", "pos": "n. phr.", "def": "pay that is reasonable and just for the work done", "zh": "公平合理的工资", "sentence": "Sustainable agriculture seeks to... provide farmers with a fair wage."}, {"word": "appealing", "phon": "/əˈpiːlɪŋ/", "pos": "adj.", "def": "attractive; interesting and pleasing", "zh": "有吸引力的；吸引人的", "sentence": "As the problems of industrial farming become clear, sustainable agriculture becomes more appealing."}, {"word": "promote", "phon": "/prəˈməʊt/", "pos": "v.", "def": "to support or encourage something to grow or succeed", "zh": "推广；促进", "sentence": "Countries are creating policies to promote it."}], "hardSentences": [{"en": "Many of the developments that make farms so productive right now are actually creating terrible problems for future generations.", "structure": "主干是 Many of the developments are creating terrible problems（许多发展正在制造问题）。中间 that make farms so productive right now 是定语从句，修饰 developments——「眼下让农场高产的（那些发展）」。读长定语从句时先抓主句主干「发展→制造问题」，再把从句塞回去。", "zh": "许多眼下让农场如此高产的发展，实际上正在给后代制造可怕的问题。"}, {"en": "Sustainable agriculture seeks to protect the environment of farms and their surroundings, respect the health of farm animals, provide farmers with a fair wage, and ensure that workers are respected and paid fairly.", "structure": "seeks to 后面跟了四个并列动词：protect / respect / provide / ensure，一条长「目标清单」。最后一个 ensure 带 that 宾语从句，从句里 are respected and paid fairly 是被动语态（被尊重、被公平付酬）。遇到一长串并列，数清楚有几项，意思就清楚了。", "zh": "可持续农业力求做到：保护农场及周边环境，尊重农场动物的健康，为农民提供公平的工资，并确保工人受到尊重、报酬合理。"}, {"en": "With farming, as with so much else, we are discovering that bigger, faster, and more is not necessarily better.", "structure": "开头 With farming 是「在农业这件事上」；as with so much else 是插入语（= 就像许多其他事情一样），两个逗号夹住，可以先跳过读主干。主干 we are discovering that... 中，that 宾语从句的主语是 bigger, faster, and more（三个比较级当一个整体，所以用 is）。not necessarily = 不一定，很常用的委婉表达。", "zh": "在农业这件事上——正如在许多其他事情上一样——我们正在发现：更大、更快、更多，并不一定更好。"}], "questions": [{"n": 1, "technique": "Main Idea", "techniqueZh": "中心思想", "q": "What is the main topic of this article?", "options": ["The founders of sustainable agriculture.", "The lives of the first farmers.", "The goals and practices of sustainable agriculture.", "The pros and cons of sustainable agriculture."], "answer": 2, "skillTip": "中心思想题看「全文笔墨分布」：前两段引出问题后，后三段全部在讲可持续农业——目标是什么（protect/respect/provide/ensure）、做法有哪几条（五个 They...）。谁占的段落最多，谁就是中心。再对照标题 Farming for the Future，「为未来」正对应 sustainable。", "explain": "全文结构是「工业农业有问题 → 可持续农业来解决问题 → 可持续农业越来越受欢迎」，重心落在可持续农业的目标（第三段四大目标）和做法（第四段五条实践）上，所以选 c。", "why": "a「可持续农业的创始人」全文根本没提到任何人物；b「最早农民的生活」只在第一句 Mesopotamia 一带而过，是引入不是主题；d 的陷阱在 pros and cons（优点和缺点）——文章只讲了可持续农业的好处，没有讨论它的缺点，「正反面都谈」不成立。"}, {"n": 2, "technique": "Subject Matter", "techniqueZh": "主题", "q": "What is this passage mainly about?", "options": ["A region.", "A farm.", "A set of practices.", "A period of history."], "answer": 2, "skillTip": "主题题让你回答「这篇文章写的是哪一类东西」。把选项都换成一个问题问自己：文章主要在讲一个地区吗？一个农场吗？一段历史吗？——都不是。文章一条条列出可持续农业怎么种地（有机耕作、轮作、善待动物、雇人不用机器），这是在讲「一整套做法」。", "explain": "第三、四段是全文主体，用五个 They... 排比具体列出可持续农场的做法，所以这篇的主题是 a set of practices（一套实践/做法），选 c。", "why": "a「一个地区」——Mesopotamia 只在开头提了一句，不是主角；b「一个农场」范围太小，文章讲的是整个农业方式，不是某个具体农场；d「一段历史时期」——13,000 年的历史只是开头的引子，文章讲的是现在和未来怎么做，不是历史。"}, {"n": 3, "technique": "Supporting Details", "techniqueZh": "支持性细节", "q": "Which statement is supported by the passage?", "options": ["Sustainable agriculture uses antibiotics and pesticides to ensure meat is safe.", "Sustainable farming practices maximize production over other concerns.", "Sustainable agriculture focuses on the needs of plants rather than the needs of workers.", "Sustainable farming practices extend beyond farms into communities."], "answer": 3, "skillTip": "细节题要逐项回原文找「对得上号」的句子，找不到原句支撑的选项直接划掉。注意出题人爱把原文词换个说法（paraphrase）：原文说 provide farmers with a fair wage、workers are respected and paid fairly、employ humans over machines——这些都超出「种地」本身，关系到农民和社区，正好对应 d 的 extend beyond farms into communities。", "explain": "第三段说可持续农业要给农民公平工资、让工人受尊重；第二段提到工业农业导致 communities are collapsing（社区瓦解），言下之意可持续做法能保护社区。这些都说明可持续农业的影响超出农场本身、延伸到社区，选 d。", "why": "a 与原文正好相反——第四段说 avoid giving them antibiotics（避免使用抗生素）；b 也相反——第三段明说 Instead of maximizing production now（不追求产量最大化）；c 还是相反——可持续农业恰恰强调 workers are respected and paid fairly（关心工人）。三个错项都是把原文意思反过来说，识别这种「反着说」的干扰项是细节题的基本功。"}, {"n": 4, "technique": "Inference", "techniqueZh": "推理", "q": "Which is true about rotating crops?", "options": ["It is good for the soil.", "It is bad for the soil.", "It isn't sustainable.", "It is bad for productivity."], "answer": 0, "skillTip": "推理题找原文里的因果链条。第四段：They grow and rotate diverse crops so that soil is replenished rather than depleted——so that（以便、结果是）引出结果：土壤被补充而不是被耗尽。土壤被补充＝对土壤好，一步推理就到答案。盯住 so that、because、therefore 这类因果信号词。", "explain": "原文说轮作多种作物「so that soil is replenished rather than depleted」（使土壤得到补充而不是耗尽）。replenished（补充）和 depleted（耗尽）是反义词，土壤养分得到补充，说明轮作对土壤有好处，选 a。", "why": "b「对土壤不好」与原文 replenished（得到补充）相反；c「不可持续」也相反——轮作恰恰是可持续农业的做法之一；d「不利于产量」文章没提，而且既然是可持续做法，作者的态度明显是支持的，不可能说它有害。"}, {"n": 5, "technique": "Words in Context", "techniqueZh": "语境词义", "q": "What does the word deplete in the second paragraph mean?", "options": ["To diminish the amount or quality of something.", "To measure something.", "To increase the amount of something.", "To arrange something differently."], "answer": 0, "skillTip": "语境词义题两步走：①把四个选项逐个代回原句，读读通不通；②找上下文线索。这里第二段整段在讲工业农业制造的「问题」（terrible problems），deplete 一定是个坏词；第四段还有现成线索：soil is replenished rather than depleted——replenish（补充）和 deplete 用 rather than（而不是）对立起来，说明 deplete 就是「耗尽、减少」。", "explain": "代回原句 Soil is being depleted of nutrients（土壤的养分被……）：在「问题清单」的语境里，养分只能是被「耗尽、减少」，不可能是增加或测量。再对照 replenished rather than depleted 的反义关系，确定选 a（使某物的数量或质量减少）。", "why": "b「测量」和 d「重新排列」代入句意完全不通；c「增加」方向相反——增加养分是好事，而这句出现在问题清单里，而且和 replenish 是反义关系。"}, {"n": 6, "technique": "Clarifying Devices", "techniqueZh": "阐释手法", "q": "What does the writer do in the first and second paragraphs?", "options": ["Tells a personal story.", "Describes causes and effects.", "Describes a sequence of steps in a process.", "Gives opinions but no facts."], "answer": 1, "skillTip": "阐释手法题问「作者用什么方式把观点讲清楚」。回顾前两段：第一段讲新机器、新化学品、政策（因）让农场变成工业企业（果）；第二段讲这些发展（因）造成土壤流失、社区瓦解（果）。处处是「因为 A 所以 B」的链条，这就是 describes causes and effects。找信号词：turned...into（把……变成）、creating problems（造成问题）。", "explain": "第一段的因果链：新机器、新化学品、专业化、政策 → 农场变成大工业企业、农民减少；第二段的因果链：这些发展 → 化学品渗漏、土壤养分流失、社区瓦解、家庭农场落败。两段都在「摆原因、说结果」，选 b。", "why": "a「讲个人故事」——全文没有出现任何人物经历；c「描述流程步骤」——前两段没有 first/then/next 式的操作顺序，讲步骤的是后面第四段的做法清单；d「只有观点没有事实」错误——13,000 年前、最近六十年、化学品渗漏等都是事实陈述。"}]}, {"id": "day006", "day": 6, "title": "Alphonse Mucha", "titleZh": "阿尔丰斯·穆夏", "category": "People", "categoryZh": "人物", "textForm": "Biography / 人物传记类说明文", "wordCount": 330, "level": "B1-B2", "techniques": ["Main Idea", "Subject Matter", "Supporting Details", "Inference", "Words in Context", "Clarifying Devices"], "intro": "本篇是《超强英语阅读训练 2》Day 6，讲捷克艺术家阿尔丰斯·穆夏（Alphonse Mucha）——一张偶然接手的海报让他名声大噪，成为「新艺术运动」（Art Nouveau）的代表人物。人物传记的读法：抓时间线（born 1860 → 1879 打工 → 1884 上艺校 → 1894 成名海报 → 1910 画史诗巨作），再看「他人生的转折点」和「作者怎么评价他」。本篇有两道送分题（portrait 词义、meanwhile 用法），也有两道需要绕一下的题，注意精讲里的拆法。", "passages": [{"en": "Alphonse Mucha wanted to be a serious painter. Well, first he wanted to be a serious singer, but when his voice broke, he turned to visual art. Born in 1860, he started working for a firm that made stage sets in 1879. Meanwhile, he practiced painting and applied to art schools. However, his stage and theater design experience would be far more useful than his art training.", "zh": "阿尔丰斯·穆夏想成为一名严肃的画家。嗯，其实起初他想当一名严肃的歌手，但变声期嗓子倒仓之后，他转向了视觉艺术。他生于 1860 年，1879 年开始在一家制作舞台布景的公司工作。与此同时，他练习绘画，并申请艺术学校。然而，他的舞台和戏剧设计经验，日后证明比他在美术院校受的训练有用得多。", "note": "开头一句 Well, first he... 带出口语化的自我纠正，很有意思：先说画家，再爆料他原先是想当歌手的。voice broke 指男孩变声期嗓音变化（不是「嗓子坏了」）。注意 Meanwhile（与此同时）——第 6 题专考它：边打工边学画，两件事同时进行。"}, {"en": "Mucha finally got into art school in 1884. He painted portraits and other scenes, but painting wasn't a very good way to earn a living. To earn more money, Mucha made illustrations for books, magazines, and advertisements. In 1894, he made history with a poster.", "zh": "穆夏终于在 1884 年进了艺术学校。他画肖像画和其他题材，但靠画画很难谋生。为了多赚钱，穆夏给书籍、杂志和广告画插图。1894 年，他凭一张海报创造了历史。", "note": "earn a living（谋生）是高频短语。段尾 In 1894, he made history with a poster 是悬念句——一张海报怎么就「创造历史」了？下一段马上揭晓。读传记要留意这种段尾钩子。"}, {"en": "Mucha got the poster job, an advertisement for the show Gismonda, unexpectedly. There was an emergency, and he volunteered to create the poster quickly. What he made turned the advertising world upside down. Mucha created a dramatic, vertically elongated poster with pastel colors, draping and floral details, and little text. This was a change from earlier, plainer, text-based posters. From then on, Mucha was in demand. His signature style came to define Art Nouveau: stylized figures, elongated shapes, natural curves, and plant imagery. Mucha's work often featured beautiful women in flowing robes.", "zh": "穆夏出乎意料地得到了那份海报工作——为戏剧《吉斯蒙达》做广告。当时情况紧急，他自告奋勇快速赶制了这张海报。他的作品彻底颠覆了广告界：画面富有戏剧性，竖向拉长，色彩柔和，有垂坠感和花卉装饰细节，文字极少。这与之前那些朴素的、以文字为主的海报完全不同。从那时起，穆夏成了抢手人物。他的标志性风格逐渐定义了「新艺术运动」：程式化的人物、拉长的造型、自然的曲线和植物图案。穆夏的作品常常以身着飘逸长袍的美丽女子为主角。", "note": "全篇最重要的一段，信息密度很高，别慌，拆成三层：①怎么接到活的（emergency + volunteered，纯属偶然）；②海报长什么样、新在哪（与 plainer, text-based posters 对比）；③影响（in demand 抢手 → define Art Nouveau 定义了一个流派）。turned the advertising world upside down 不是「把世界倒过来」，是「彻底颠覆」。"}, {"en": "For the next twenty years, Mucha made posters, illustrations, decorative panels, and even designed the facade and interior of a building. Most of these designs included natural symbols and patterns. Many were influenced by Asian silk-screen paintings.", "zh": "接下来的二十年里，穆夏制作海报、插图、装饰板画，甚至设计过一栋大楼的外立面和内部。这些设计大多包含自然元素的符号和图案，许多还受到亚洲绢网版画的影响。", "note": "时间词 For the next twenty years 一开头，就知道这段讲他成名后的高产期。最后一句话很短但埋了考点：受 Asian（亚洲）绘画影响——第 3 题的 NOT true 题就考这个细节，选项把 Asian 偷换成了 America。"}, {"en": "For all his success, Mucha longed for respect as an academic painter. He began The Slav Epic around 1910. The twenty enormous paintings told the story of his native Czechoslovakia (formerly Moravia). He eventually gave this masterwork to his country, which put it in storage for decades.", "zh": "尽管取得了这一切成功，穆夏仍渴望作为学院派画家获得尊重。他在 1910 年前后开始创作《斯拉夫史诗》。这二十幅巨画讲述了他的祖国捷克斯洛伐克（旧称摩拉维亚）的故事。他最终把这部杰作赠给了国家，而国家却把它束之高阁，在仓库里存放了几十年。", "note": "For all his success（尽管成功）是让步转折的标志——海报大师内心却想当严肃画家，首尾呼应了第一段。结尾 which put it in storage for decades（国家把它存进仓库几十年）是第 4 题推理的关键：杰作被压箱底 = 多年不被欣赏。"}, {"en": "Mucha produced paintings after his success as an illustrator and designer, but they were never as popular as his other work. Still, his influence is far-reaching and long-lasting, lingering in every music or movie poster we see today.", "zh": "在作为插画师和设计师大获成功之后，穆夏也创作了油画，但它们从未像他其他作品那样受欢迎。尽管如此，他的影响深远而持久，至今仍萦绕在我们看到的每一张音乐或电影海报里。", "note": "收尾段用 Still（尽管如此）一转：严肃油画没红，但他的设计风格活到了今天。lingering in every music or movie poster we see today 是很美的写法——影响像余韵一样「萦绕」在当代海报中。评价人物时作者的态度就在这里：真正的艺术史地位，靠的不是他自己最想要的那个身份。"}], "vocab": [{"word": "portrait", "phon": "/ˈpɔːtrɪt/", "pos": "n.", "def": "a painting or photograph of a person", "zh": "肖像画；人像照片", "sentence": "He painted portraits and other scenes, but painting wasn't a very good way to earn a living."}, {"word": "earn a living", "phon": "/ɜːn ə ˈlɪvɪŋ/", "pos": "v. phr.", "def": "to make enough money to live on", "zh": "谋生；挣钱糊口", "sentence": "Painting wasn't a very good way to earn a living."}, {"word": "illustration", "phon": "/ˌɪləˈstreɪʃn/", "pos": "n.", "def": "a picture in a book, magazine, etc.", "zh": "插图；插画", "sentence": "Mucha made illustrations for books, magazines, and advertisements."}, {"word": "advertisement", "phon": "/ədˈvɜːtɪsmənt/", "pos": "n.", "def": "a notice or poster that tries to sell something", "zh": "广告", "sentence": "Mucha got the poster job, an advertisement for the show Gismonda, unexpectedly."}, {"word": "unexpectedly", "phon": "/ˌʌnɪkˈspektɪdli/", "pos": "adv.", "def": "in a way that was not expected; by surprise", "zh": "出乎意料地；意外地", "sentence": "Mucha got the poster job... unexpectedly."}, {"word": "volunteer", "phon": "/ˌvɒlənˈtɪə/", "pos": "v.", "def": "to offer to do something without being asked or paid", "zh": "自愿（做）；自告奋勇", "sentence": "There was an emergency, and he volunteered to create the poster quickly."}, {"word": "turn ... upside down", "phon": "/tɜːn ˈʌpsaɪd daʊn/", "pos": "v. phr.", "def": "to change something completely", "zh": "彻底颠覆；彻底改变", "sentence": "What he made turned the advertising world upside down."}, {"word": "elongated", "phon": "/ˈiːlɒŋɡeɪtɪd/", "pos": "adj.", "def": "made longer than usual; stretched", "zh": "拉长的；细长的", "sentence": "Mucha created a dramatic, vertically elongated poster with pastel colors."}, {"word": "pastel", "phon": "/ˈpæstl/", "pos": "adj.", "def": "(of colors) soft and light, not bright", "zh": "（颜色）柔和的；淡彩的", "sentence": "Mucha created a dramatic, vertically elongated poster with pastel colors, draping and floral details, and little text."}, {"word": "floral", "phon": "/ˈflɔːrəl/", "pos": "adj.", "def": "decorated with flowers; relating to flowers", "zh": "花卉的；饰有花卉图案的", "sentence": "...with pastel colors, draping and floral details, and little text."}, {"word": "in demand", "phon": "/ɪn dɪˈmɑːnd/", "pos": "adj. phr.", "def": "wanted by many people; very popular", "zh": "抢手的；需求旺盛的", "sentence": "From then on, Mucha was in demand."}, {"word": "signature style", "phon": "/ˈsɪɡnətʃə staɪl/", "pos": "n. phr.", "def": "a special style that shows who made something", "zh": "标志性的（个人）风格", "sentence": "His signature style came to define Art Nouveau."}, {"word": "Art Nouveau", "phon": "/ˌɑːt nuːˈvəʊ/", "pos": "n. (proper)", "def": "an art style popular around 1890-1910, with curving lines and plant shapes", "zh": "新艺术运动（19 世纪末流行的装饰艺术风格）", "sentence": "His signature style came to define Art Nouveau: stylized figures, elongated shapes, natural curves, and plant imagery."}, {"word": "long for", "phon": "/lɒŋ fɔː/", "pos": "v. phr.", "def": "to want something very much", "zh": "渴望；热切盼望", "sentence": "For all his success, Mucha longed for respect as an academic painter."}, {"word": "epic", "phon": "/ˈepɪk/", "pos": "n.", "def": "a long work that tells a grand story of heroes or history", "zh": "史诗；史诗般的巨作", "sentence": "He began The Slav Epic around 1910."}, {"word": "enormous", "phon": "/ɪˈnɔːməs/", "pos": "adj.", "def": "very, very big", "zh": "巨大的；庞大的", "sentence": "The twenty enormous paintings told the story of his native Czechoslovakia."}, {"word": "masterwork", "phon": "/ˈmɑːstəwɜːk/", "pos": "n.", "def": "a person's greatest piece of work; masterpiece", "zh": "杰作；代表作", "sentence": "He eventually gave this masterwork to his country, which put it in storage for decades."}, {"word": "far-reaching", "phon": "/ˌfɑː ˈriːtʃɪŋ/", "pos": "adj.", "def": "having a great influence that spreads widely", "zh": "影响深远的", "sentence": "His influence is far-reaching and long-lasting, lingering in every music or movie poster we see today."}], "hardSentences": [{"en": "However, his stage and theater design experience would be far more useful than his art training.", "structure": "这是个比较句：A would be far more useful than B（A 会比 B 有用得多）。far 用来加强比较级 more useful（=much more useful）。would be 是过去将来时——站在他当时的时间点看「后来会」，暗示后面的事实验证了这一点。主语 his stage and theater design experience 有点长，核心是 experience（经验）。", "zh": "然而，他的舞台和戏剧设计经验，日后证明比他在美术院校受的训练有用得多。"}, {"en": "Mucha created a dramatic, vertically elongated poster with pastel colors, draping and floral details, and little text.", "structure": "主干很简单：Mucha created a poster。poster 前面两个形容词 dramatic、vertically elongated（竖向拉长的）作定语；后面 with 引出三个并列的「配料」：pastel colors（柔和色彩）、draping and floral details（垂坠感与花卉细节）、little text（极少文字）。with + 名词清单 = 「带有……」，描写物品外观的常用句型。", "zh": "穆夏创作了一张富有戏剧性、竖向拉长的海报，色彩柔和，带有垂坠感和花卉装饰细节，文字极少。"}, {"en": "He eventually gave this masterwork to his country, which put it in storage for decades.", "structure": "主干 He gave this masterwork to his country（他把杰作赠给国家）。逗号后的 which 引导非限制性定语从句，指代 his country——「而这个（国家）把它存进仓库几十年」。put sth in storage = 把某物存放起来（束之高阁）；for decades = 长达几十年。这个从句藏着第 4 题的推理线索：被收进仓库 = 没被展出 = 没被欣赏。", "zh": "他最终把这部杰作赠给了国家，而国家却把它存放了几十年（没有展出）。"}], "questions": [{"n": 1, "technique": "Main Idea", "techniqueZh": "中心思想", "q": "What is the main topic of the article?", "options": ["The artistic history of Alphonse Mucha.", "Defining Art Nouveau.", "The personal life of Alphonse Mucha.", "A history of print-making."], "answer": 0, "skillTip": "中心思想题先问自己：这篇文章从头到尾围着谁转？每一段的句首主语几乎都是 Mucha——他的求学、他的海报、他的风格、他的遗憾。这是典型的人物传记，中心就是「这个人（的艺术生涯）」。警惕那些「文章里确实提到、但只占一小段」的选项。", "explain": "全文按时间线讲穆夏的艺术人生：从想当歌手到学画，1894 年一张海报成名，定义新艺术风格，晚年创作《斯拉夫史诗》。概括最完整的是 a「穆夏的艺术历程」。", "why": "b「定义新艺术运动」只是第三段一个细节，撑不起全文；c「穆夏的个人生活」错在文章讲的是他的艺术事业（artistic），不是私人生活（personal）——家庭、感情这些只字未提；d「印刷史」范围太大，文章只讲了穆夏一个人，不是整个行业的历史。"}, {"n": 2, "technique": "Subject Matter", "techniqueZh": "主题", "q": "What does this article mainly focus on?", "options": ["An artistic style.", "A period of time.", "A region.", "An artist."], "answer": 3, "skillTip": "主题题把选项变成判断题：文章主要在讲一种风格？一段时间？一个地区？一位艺术家？和第 1 题是姊妹题——中心是穆夏这个人，那主题类别自然是「一位艺术家」。传记类文章的 Subject Matter 答案通常就是 a person。", "explain": "文章是人物传记，主角始终是穆夏本人，所以选 d「一位艺术家」。", "why": "a「一种艺术风格」——Art Nouv
