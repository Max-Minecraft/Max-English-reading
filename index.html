eau 只在第三段出现，是穆夏的成就之一，不是全文主题；b「一段时间」——虽然有时间线，但时间是用来串人物的，不是主角；c「一个地区」——捷克斯洛伐克只是他的祖国，一笔带过。"}, {"n": 3, "technique": "Supporting Details", "techniqueZh": "支持性细节", "q": "Which statement is NOT true?", "options": ["Mucha was influenced by paintings from America.", "Czechoslovakia used to be called Moravia.", "Mucha was born in 1860.", "Mucha once worked as a stage designer for theaters."], "answer": 0, "skillTip": "NOT true 题是反过来的细节题：三个选项能在原文找到对应句，找不到或跟原文矛盾的那个就是答案。逐项回原文对号：b 对应 Czechoslovakia (formerly Moravia)，c 对应 Born in 1860，d 对应 working for a firm that made stage sets——都有。只剩 a，而原文说的是 Asian silk-screen paintings（亚洲），被偷换成了 America（美洲）。", "explain": "第四段原文是 Many were influenced by Asian silk-screen paintings（受亚洲绢网版画影响），a 把 Asian 换成 America，与原文矛盾，所以 NOT true 的答案是 a。", "why": "b、c、d 都能在原文找到事实依据：b 对应第五段括号 formerly Moravia（旧称摩拉维亚）；c 对应第一段 Born in 1860；d 对应第一段 working for a firm that made stage sets（为制作舞台布景的公司工作）。做这类题，能定位到原句的选项直接排除。"}, {"n": 4, "technique": "Inference", "techniqueZh": "推理", "q": "What can we infer about Mucha's The Slav Epic from this article?", "options": ["It was highly appreciated in Czechoslovakia.", "It was commissioned by the Czech government.", "It was not really appreciated in Czechoslovakia for years.", "It was a storybook about Czechoslovakia."], "answer": 2, "skillTip": "推理题的答案不会直接写在原文里，但一定有一两个「线索句」能推出来。线索在第五段：He gave this masterwork to his country, which put it in storage for decades（国家把它存进仓库几十年）。被束之高阁几十年 → 说明很多年没被展出、没被欣赏。再看第六段 they were never as popular as his other work 也能佐证。", "explain": "杰作赠给国家后 put it in storage for decades（在仓库放了几十年），说明《斯拉夫史诗》在国内多年未受重视，选 c。", "why": "a「在捷克斯洛伐克备受欣赏」与「存进仓库几十年」正好相反；b「受捷克政府委托创作」——原文说是他自己 longed for respect 主动创作、gave（赠给）国家的，不是政府下单；d「一本关于捷克斯洛伐克的故事书」错在体裁——原文明说 The twenty enormous paintings，是二十幅巨画，不是书。"}, {"n": 5, "technique": "Words in Context", "techniqueZh": "语境词义", "q": "The second paragraph tells us that Mucha painted portraits. What is a portrait?", "options": ["It is a picture of a person.", "It is a picture of an object.", "It is a picture of landscape.", "It is a picture of a historical scene."], "answer": 0, "skillTip": "这题考构词和常识。portrait 的词根 portr- 和「描绘」有关；就算不认识，看第二段语境：He painted portraits and other scenes——portraits 和「其他场景」并列，说明 portrait 本身不是场景画，而是另一类（人物）。还可以联想第三段 His work often featured beautiful women——他画的正是人物。", "explain": "portrait 意为「肖像画」，即画人的作品，选 a。文中穆夏以画美丽女子闻名，也印证他擅长人物画。", "why": "b「物体」、c「风景」、d「历史场景」都是 painting 的其他题材；原文 portraits and other scenes 的并列关系说明 portrait 与 scene（场景）是两类，剩下「人」这个类别，只有 a 符合。"}, {"n": 6, "technique": "Clarifying Devices", "techniqueZh": "阐释手法", "q": "How is the word meanwhile used in the first paragraph?", "options": ["To show that the phrase that follows it happened before the previous one.", "To show that the phrase that follows it happened after the previous one.", "To show that the phrase that follows it happened at the same time as the previous one.", "To show that the phrase that follows it contrasts with the previous one."], "answer": 2, "skillTip": "这题考连接词的逻辑功能——把连接词当成「路标」，它告诉你前后两句话是什么关系。meanwhile = mean（中间）+ while（一段时间）= 在这段时间里，即「与此同时」。回到原文：1879 年开始打工，meanwhile 练画、申请艺校——打工和学画是同一时期并行进行的两件事。表对比的是 however，表先后的是 then/afterwards，别记混。", "explain": "meanwhile 表示「与此同时」，引出与前面同时发生的事：穆夏一边在舞台布景公司工作，一边练画、申请艺术学校，选 c。", "why": "a「之前发生」和 b「之后发生」都是时间先后关系，meanwhile 恰恰表示「同时进行」，不对；d「与前面形成对比」是 however / but 的功能——第一段后面那句 However 才是转折信号，别张冠李戴。"}]}];

const CAT_COLOR = {People:'var(--peo)',Science:'var(--sci)',History:'var(--his)',Nature:'var(--nat)',Business:'var(--bus)',Culture:'var(--cul)'};
const ST = {new:{icon:'⭕',zh:'未学'},learn:{icon:'📖',zh:'在学'},done:{icon:'✅',zh:'已学'},review:{icon:'🔖',zh:'待复习'}};
const PKEY = 'max_close_reading_progress';

function loadP(){try{return JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){return {}}}
function saveP(p){localStorage.setItem(PKEY,JSON.stringify(p))}
function statusOf(id){return loadP()[id]||'new'}
function setStatus(id,s){const p=loadP();p[id]=s;saveP(p);renderShelf()}

let curCat='all', curSt='all', kw='';

function catColor(c){return CAT_COLOR[c]||'var(--oth)'}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderChips(){
  const cats=['all',...new Set(ARTICLES.map(a=>a.category))];
  document.getElementById('catChips').innerHTML=cats.map(c=>
    `<span class="chip ${c===curCat?'on':''}" data-cat="${c}">${c==='all'?'全部分类':esc(c)}</span>`).join('');
  const sts=[['all','全部状态'],['new','⭕未学'],['learn','📖在学'],['done','✅已学'],['review','🔖待复习']];
  document.getElementById('stChips').innerHTML=sts.map(([k,t])=>
    `<span class="chip ${k===curSt?'on':''}" data-st="${k}">${t}</span>`).join('');
  document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{curCat=e.dataset.cat;renderShelf()});
  document.querySelectorAll('[data-st]').forEach(e=>e.onclick=()=>{curSt=e.dataset.st;renderShelf()});
}

function renderShelf(){
  renderChips();
  const list=ARTICLES.filter(a=>{
    if(curCat!=='all'&&a.category!==curCat)return false;
    if(curSt!=='all'&&statusOf(a.id)!==curSt)return false;
    if(kw){const s=(a.title+a.titleZh+a.category+'day '+a.day+(a.techniques||[]).join(' ')).toLowerCase();
      if(!s.includes(kw.toLowerCase()))return false}
    return true;
  }).sort((a,b)=>a.day-b.day);
  const done=ARTICLES.filter(a=>statusOf(a.id)==='done').length;
  document.getElementById('stat').textContent=`共 ${ARTICLES.length} 篇 · 已学 ${done} 篇`;
  const g=document.getElementById('grid');
  document.getElementById('empty').style.display=list.length?'none':'block';
  g.innerHTML=list.map(a=>{
    const st=ST[statusOf(a.id)];
    return `<div class="card" data-id="${a.id}">
      <div class="bar" style="background:${catColor(a.category)}"></div>
      <div class="day">DAY ${a.day}</div>
      <h3>${esc(a.title)}</h3>
      <div class="zh">${esc(a.titleZh||'')}</div>
      <div class="foot">
        <span class="cat" style="background:${catColor(a.category)}">${esc(a.category)}</span>
        <span class="stbadge">${st.icon} ${st.zh}</span>
      </div></div>`;
  }).join('');
  g.querySelectorAll('.card').forEach(c=>c.onclick=()=>openArticle(c.dataset.id));
}

function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function openArticle(id){
  const a=ARTICLES.find(x=>x.id===id);if(!a)return;
  const idx=ARTICLES.sort((x,y)=>x.day-y.day).findIndex(x=>x.id===id);
  const prev=ARTICLES[idx-1],next=ARTICLES[idx+1];
  document.getElementById('shelf').style.display='none';
  const R=document.getElementById('reader');R.style.display='block';window.scrollTo(0,0);
  R.innerHTML=`
   <div class="rtop">
     <button class="btn" onclick="backShelf()">← 返回书架</button>
     <button class="btn ${statusOf(id)==='done'?'p':''}" onclick="setStatus('${id}','done');openArticle('${id}')">✅ 标记已学</button>
     <button class="btn" onclick="setStatus('${id}','review');openArticle('${id}')">🔖 待复习</button>
   </div>
   <div class="meta"><span>DAY ${a.day}</span><span>${esc(a.category)}</span>
     <span>${esc(a.textForm||'')}</span><span>约 ${a.wordCount||''} 词</span><span>难度 ${esc(a.level||'')}</span></div>
   <h1 class="rtitle">${esc(a.title)}</h1>
   <div class="zh" style="display:block;background:none;padding:0;color:var(--sub)">${esc(a.titleZh||'')}</div>
   <div class="tags">${(a.techniques||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
   ${a.intro?`<div class="sec"><div class="introbox">${esc(a.intro)}</div></div>`:''}
   ${secPassages(a)}${secVocab(a)}${secHard(a)}${secQuestions(a)}
   <div class="footnav">
     <button class="btn" ${prev?`onclick="openArticle('${prev.id}')"`:'disabled style=opacity:.4'}>← 上一篇</button>
     <button class="btn" onclick="backShelf()">回书架</button>
     <button class="btn" ${next?`onclick="openArticle('${next.id}')"`:'disabled style=opacity:.4'}>下一篇 →</button>
   </div>`;
  if(statusOf(id)==='new')setStatus(id,'learn');
}
function backShelf(){document.getElementById('reader').style.display='none';
  document.getElementById('shelf').style.display='block';renderShelf();window.scrollTo(0,0)}

function secPassages(a){
  return `<div class="sec"><h2>📖 全文精读（中英对照）</h2>`+
    a.passages.map((p,i)=>`<div class="pg">
      <div class="en">${esc(p.en)} <button class="spk" onclick="speak(this.dataset.t)" data-t="${esc(p.en)}">🔊</button></div>
      <span class="zh-toggle" onclick="this.nextElementSibling.classList.toggle('show')">🔽 显示/隐藏中文翻译</span>
      <div class="zh">${esc(p.zh)}</div>
      ${p.note?`<div class="pnote">${esc(p.note)}</div>`:''}</div>`).join('')+`</div>`;
}
function secVocab(a){
  return `<div class="sec"><h2>📝 生词 & 短语（${a.vocab.length}）</h2>
    <table class="v"><tr><th>单词/短语</th><th>词性</th><th>释义</th><th>文中原句</th></tr>`+
    a.vocab.map(v=>`<tr>
      <td><span class="w">${esc(v.word)}</span> <button class="spk" onclick="speak(this.dataset.t)" data-t="${esc(v.word)}">🔊</button><br><span class="phon">${esc(v.phon||'')}</span></td>
      <td><span class="pos">${esc(v.pos||'')}</span></td>
      <td>${esc(v.zh||'')}<br><span class="phon">${esc(v.def||'')}</span></td>
      <td><span class="phon">${esc(v.sentence||'')}</span></td></tr>`).join('')+`</table></div>`;
}
function secHard(a){
  if(!a.hardSentences||!a.hardSentences.length)return'';
  return `<div class="sec"><h2>🔧 长难句拆解</h2>`+
    a.hardSentences.map(h=>`<div class="hs">
      <div class="en">${esc(h.en)} <button class="spk" onclick="speak(this.dataset.t)" data-t="${esc(h.en)}">🔊</button></div>
      <div class="st">🧩 ${esc(h.structure)}</div>
      <div class="zh2">译：${esc(h.zh)}</div></div>`).join('')+`</div>`;
}
function secQuestions(a){
  return `<div class="sec"><h2>🎯 逐题精讲（先勾选答案，点「确认」看对错和解析）</h2>`+
    a.questions.map(q=>{
      const qid=`q_${a.id}_${q.n}`;
      const opts=q.options.map((o,i)=>`<div class="opt" data-i="${i}" onclick="pickOpt('${qid}',${i})">${String.fromCharCode(97+i)}. ${esc(o)}</div>`).join('');
      return `<div class="qa" id="${qid}" data-ans="${q.answer}">
        <div class="qh"><span class="qn">${q.n}</span><span class="qtech">${esc(q.technique)} · ${esc(q.techniqueZh||'')}</span></div>
        <div class="qtext">${esc(q.q)}</div>
        <div class="opts">${opts}</div>
        <div class="qact">
          <button class="btn p cfm" onclick="qAct('${qid}')" disabled>✔ 确认答案</button>
          <span class="qres"></span>
        </div>
        <div class="reveal">
          <div class="tipbox">🔑 <b>技巧点拨（${esc(q.techniqueZh||q.technique)}）：</b>${esc(q.skillTip||'')}</div>
          <div class="lab">✅ 正确答案：${String.fromCharCode(97+q.answer)}</div>
          <div class="lab">为什么选它</div><p>${esc(q.explain||'')}</p>
          <div class="lab">其他选项为什么错</div><p>${esc(q.why||'')}</p>
        </div></div>`;
    }).join('')+`</div>`;
}
function pickOpt(qid,i){
  const box=document.getElementById(qid);
  if(box.dataset.done)return; // 已确认锁定
  box.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',+o.dataset.i===i));
  box.dataset.sel=i;
  box.querySelector('.cfm').disabled=false;
}
function qAct(qid){
  const box=document.getElementById(qid);
  if(box.dataset.done)resetQ(qid);else confirmQ(qid);
}
function confirmQ(qid){
  const box=document.getElementById(qid);
  if(box.dataset.done||box.dataset.sel===undefined)return;
  const sel=+box.dataset.sel,ans=+box.dataset.ans;
  box.dataset.done='1';
  box.querySelectorAll('.opt').forEach(o=>{
    const i=+o.dataset.i;
    if(i===ans)o.classList.add('right');
    if(i===sel&&sel!==ans)o.classList.add('wrong');
  });
  const res=box.querySelector('.qres');
  if(sel===ans){res.textContent='✅ 答对啦，真棒！';res.className='qres ok';}
  else{res.textContent=`❌ 你选了 ${String.fromCharCode(97+sel)}，正确答案是 ${String.fromCharCode(97+ans)}，看看下面的解析吧`;res.className='qres no';}
  box.querySelector('.reveal').classList.add('show');
  const btn=box.querySelector('.cfm');
  btn.textContent='🔄 重做这题';btn.classList.remove('p');
}
function resetQ(qid){
  const box=document.getElementById(qid);
  delete box.dataset.done;delete box.dataset.sel;
  box.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','right','wrong'));
  box.querySelector('.reveal').classList.remove('show');
  box.querySelector('.qres').textContent='';
  const btn=box.querySelector('.cfm');
  btn.textContent='✔ 确认答案';btn.classList.add('p');btn.disabled=true;
}
document.getElementById('search').addEventListener('input',e=>{kw=e.target.value.trim();renderShelf()});
renderShelf();
</script>
</body>
